<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="neon-bg"></div>
    <div class="scanlines"></div>

    <div class="app-layout">
        <!-- ШАПКА -->
        <header class="top-section">
            <div class="inline-player">
                <div class="player-info-col">
                    <div class="top-row">
                        <div class="logo-small">LEPOTA<span class="neon-text">FM</span></div>
                        <div class="vol-mini-container">
                            <i class="fas fa-volume-down tiny-icon"></i>
                            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                        </div>
                    </div>
                    <div class="bot-row">
                        <div class="marquee-container">
                            <div class="marquee-content">
                                <span id="track-name">Загрузка...</span>
                                <span class="separator" id="track-sep"> - </span>
                                <span id="artist-name">LepotaFM</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="player-btn-col">
                    <button id="play-btn" class="big-play-btn">
                        <img id="mini-art" src="logo.jpg" alt="Art" onerror="this.src='logo.jpg'">
                        <span class="icon-overlay"><i class="fas fa-play" id="play-icon"></i></span>
                    </button>
                </div>
            </div>

            <!-- МЕНЮ ВКЛАДОК -->
            <nav class="tabs">
                <button class="tab-btn active" onclick="openTab('home', this)">Главная</button>
                <button class="tab-btn" onclick="openTab('games', this)">Игры</button>
                <button class="tab-btn" onclick="openTab('ether', this)">Эфир</button>
                <button class="tab-btn" onclick="openTab('menu', this)">Меню</button>
            </nav>
        </header>

        <!-- КОНТЕНТ -->
        <main class="content-section">
            
            <!-- ГЛАВНАЯ (Здесь может быть игра) -->
            <div id="home" class="tab-pane active full-height">
                <!-- Если ты хочешь вставить игру, раскомментируй iframe ниже, 
                     НО создай папку game на сервере или в assets -->
                <!-- <iframe id="game-frame" src="game/index.html"></iframe> -->
                
                <!-- Пока просто заглушка, чтобы не было пусто -->
                <div class="placeholder-box" style="padding-top: 50px;">
                    <h3>Добро пожаловать</h3>
                    <p>Слушайте LepotaFM</p>
                </div>
            </div>

            <div id="games" class="tab-pane scrollable-pad">
                <div class="placeholder-box"><h3>Каталог игр</h3><p>Скоро...</p></div>
            </div>

            <div id="ether" class="tab-pane scrollable-pad">
                <div class="history-list" id="history-container">
                    <div class="loading-msg">Загрузка...</div>
                </div>
            </div>

            <div id="menu" class="tab-pane scrollable-pad">
                <div class="settings-box">
                    <div class="placeholder-box"><p>Настройки</p></div>
                </div>
            </div>
        </main>
    </div>

    <!-- МОДАЛКА -->
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" onclick="closeSku()">✕</button>
            <img id="modal-art" src="logo.jpg">
            <h2 id="modal-title">...</h2>
            <p id="modal-artist">...</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
