<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@barba/core"></script>
    <script src="https://unpkg.com/gsap@latest/dist/gsap.min.js"></script>
</head>
<body data-barba="wrapper">

    <header>
        <div class="logo">LEPOTA<span style="color:#ff0055">FM</span></div>
        <nav>
            <a href="index.html">Эфир</a>
            <a href="chat.html">Чат</a>
        </nav>
    </header>

    <main data-barba="container" data-barba-namespace="home">
        <div class="content-box">
            <div class="dj-info">
                <!-- ГЛАВНОЕ: onerror вернет логотип, если новая картинка не грузится -->
                <img id="album-art" src="logo.jpg" alt="Обложка" onerror="this.onerror=null; this.src='logo.jpg';">
                
                <div class="track-text-box">
                    <h2 id="track-name">LepotaFM</h2>
                    <p id="artist-name">Лучшая музыка</p>
                </div>
            </div>

            <div class="social-links">
                <a href="https://t.me/lepotafm" target="_blank" class="social-btn">TG</a>
            </div>
        </div>
    </main>

    <div class="fixed-player">
        <button id="play-btn">
            <span id="play-icon">▶</span>
        </button>
        <div class="track-info-mini">
            <span id="mini-track-name">Нажмите Play</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
