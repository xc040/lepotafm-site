<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Страж Эфира 14.2 - Elite Loop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --neon-green: #39ff14; --neon-blue: #00f3ff; --neon-red: #ff0055; 
            --neon-purple: #bc13fe; --neon-gold: #ffcf00; --bg-dark: #05050f;
        }
        body { 
            margin: 0; padding: 0; background: var(--bg-dark); color: #fff; 
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; 
        }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* ИНТЕРФЕЙСНЫЕ СЛОИ */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .app-controls { 
            position: absolute; top: 0; left: 0; right: 0; height: 55px; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px; background: rgba(15, 15, 30, 0.95); border-bottom: 2px solid var(--neon-purple); 
            pointer-events: auto; 
        }
        .control-btn { 
            width: 40px; height: 40px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--neon-blue); border-radius: 50%; 
            color: var(--neon-blue); display: flex; align-items: center; 
            justify-content: center; cursor: pointer; transition: 0.2s;
        }

        .stat-box { 
            position: absolute; background: rgba(5, 5, 20, 0.9); 
            padding: 8px 12px; border: 1px solid var(--neon-blue); 
            border-radius: 10px; pointer-events: auto; font-size: 11px; 
        }
        #top-left { top: 70px; left: 15px; }
        #top-right { top: 70px; right: 15px; text-align: right; }

        .progress-container { 
            width: 100px; height: 6px; background: #111; border-radius: 3px; 
            overflow: hidden; border: 1px solid #333; margin-top: 4px;
        }
        #signal-bar { width: 100%; height: 100%; background: var(--neon-green); transition: width 0.3s; }

        /* МИССИИ (УРОВЕНЬ) */
        #mission-box {
            position: absolute; bottom: 35px; left: 20px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--neon-blue);
            padding: 8px 12px; border-radius: 12px; width: 160px; z-index: 20;
            pointer-events: auto; border-left: 4px solid var(--neon-purple);
        }
        #mission-title { font-size: 8px; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 2px; }
        #mission-text { font-size: 10px; font-weight: bold; color: #fff; line-height: 1.2; }

        /* ДЖОЙСТИК СПРАВА */
        #joystick-zone { 
            position: absolute; bottom: 40px; right: 30px; width: 110px; height: 110px; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 243, 255, 0.2); 
            border-radius: 50%; pointer-events: auto; 
        }
        #joystick-stick { 
            position: absolute; top: 50%; left: 50%; width: 45px; height: 45px; 
            background: var(--neon-blue); border-radius: 50%; transform: translate(-50%, -50%); 
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* МАГАЗИН */
        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000; display: flex; 
            align-items: center; justify-content: center; pointer-events: auto; 
        }
        .shop-content { 
            width: 92%; max-width: 380px; background: #0a0a1a; 
            border: 2px solid var(--neon-purple); padding: 20px; border-radius: 20px; overflow-y: auto; max-height: 85vh;
        }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .shop-item { 
            background: rgba(255,255,255,0.05); border: 1px solid #333; 
            padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; 
        }
        .shop-item i { color: var(--neon-blue); font-size: 22px; margin-bottom: 5px; display: block; }
        .shop-item b { font-size: 11px; color: var(--neon-green); display: block; }
        .shop-item span { display: block; font-size: 10px; color: var(--neon-blue); font-weight: bold; margin-top: 4px; }

        /* ЭКРАНЫ */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 100; pointer-events: auto; 
        }
        .btn-start { 
            padding: 16px 50px; font-size: 18px; font-weight: bold; background: none; 
            border: 2px solid var(--neon-green); color: var(--neon-green); 
            border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px var(--neon-green);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="app-controls">
            <button class="control-btn" onclick="window.toggleShop(true)"><i class="fas fa-shopping-cart"></i></button>
            <div style="color: var(--neon-blue); font-weight: bold; font-size: 14px; letter-spacing: 2px;">СТРАЖ ЭФИРА</div>
            <button class="control-btn" onclick="window.togglePause()"><i class="fas fa-pause" id="pause-icon"></i></button>
        </div>

        <div id="top-left" class="stat-box">
            <div>ЗАРЯД ТУРЕЛЕЙ</div>
            <div class="progress-container"><div id="signal-bar"></div></div>
        </div>
        
        <div id="top-right" class="stat-box">
            <div>ЯДРО: <span id="lives-val" style="color:var(--neon-red)">3</span></div>
            <div>ДАННЫЕ: <span id="score-val" style="color:var(--neon-gold); font-weight:bold;">0</span></div>
        </div>

        <div id="mission-box" class="hidden">
            <div id="mission-title">УРОВЕНЬ <span id="m-id">1</span></div>
            <div id="mission-text">Загрузка...</div>
        </div>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-purple); text-align:center; font-size: 20px; margin:0;">МОДЕРНИЗАЦИЯ</h2>
            <p style="font-size:11px; color:#aaa; margin: 10px 0;">Турели тратят заряд. Вернись на базу, чтобы отдать массу хвоста и зарядить пушки.</p>
            <div style="text-align:center; margin-bottom:10px; font-size:12px; color:var(--neon-gold)">БАЛАНС: <span id="shop-credits">0</span> CR</div>
            <div class="shop-grid">
                <div class="shop-item" onclick="window.buyUpgrade('turret', 1200)">
                    <i class="fas fa-crosshairs"></i><b>Пушка</b><span>1200 CR</span>
                </div>
                <div class="shop-item" onclick="window.buyUpgrade('laser', 3000)">
                    <i class="fas fa-bolt"></i><b>Лазер</b><span>3000 CR</span>
                </div>
                <div class="shop-item" onclick="window.buyUpgrade('drone', 2000)">
                    <i class="fas fa-robot"></i><b>Дрон</b><span>2000 CR</span>
                </div>
                <div class="shop-item" onclick="window.buyUpgrade('fix', 2500)">
                    <i class="fas fa-tools"></i><b>Ремонт</b><span>2500 CR</span>
                </div>
            </div>
            <button class="btn-start" style="width:100%; font-size:14px;" onclick="window.toggleShop(false)">В БОЙ</button>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="color:var(--neon-blue); letter-spacing:5px; text-shadow: 0 0 20px var(--neon-blue); margin-bottom: 30px;">СТРАЖ ЭФИРА</h1>
        <button class="btn-start" onclick="window.startGame()">ЗАПУСК СИСТЕМЫ</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">СВЯЗЬ ПОТЕРЯНА</h1>
        <div id="final-stats" style="margin-bottom:20px; color:#888;"></div>
        <button class="btn-start" onclick="location.reload()">ПЕРЕЗАГРУЗКА</button>
    </div>

<script>
/** --- CONFIG & STATE --- */
const WORLD_SIZE = 5000; // Увеличили мир для Босса
const BASE_POS = { x: 2500, y: 2500 };
const ZOOM = 0.28;

let canvas, ctx, gameId;
let started = false, paused = false;
let score = 0, baseAmmo = 100, lives = 3;
let snake = { x: 2550, y: 2550, segments: [], angle: 0, speed: 5.5, size: 25, length: 20 };
let entities = { food: [], enemies: [], particles: [], turrets: [], bullets: [], drones: [], loot: [], boss: null };
let camera = { x: 0, y: 0 }, input = { x: 0, y: 0 };
let curMission = 0, missionProgress = 0, frameCount = 0, shieldActive = false;

window.startGame = startGame; window.toggleShop = toggleShop; window.togglePause = togglePause; window.buyUpgrade = buyUpgrade;
    /** --- РЕГИСТРАЦИЯ ГЛОБАЛЬНЫХ ФУНКЦИЙ --- */
window.startGame = startGame;
window.toggleShop = toggleShop;
window.togglePause = togglePause;
window.buyUpgrade = buyUpgrade;

/** --- ИНИЦИАЛИЗАЦИЯ ДВИЖКА --- */
window.addEventListener('load', () => {
    canvas = document.getElementById('gameCanvas');
    if (canvas) {
        ctx = canvas.getContext('2d');
        resize();
        initJoystick();
        window.addEventListener('resize', resize);
        console.log("Elite Master System v14.2: Ready");
    }
});

function resize() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

/** --- ЗАПУСК ИГРЫ (ГЛУБОКИЙ СБРОС) --- */
function startGame() {
    if (started) return;

    // 1. Очистка интерфейса
    const startOverlay = document.getElementById('start-screen');
    if (startOverlay) startOverlay.style.display = 'none';
    const gov = document.getElementById('game-over-screen');
    if (gov) gov.classList.add('hidden');
    document.getElementById('mission-box').classList.remove('hidden');

    // 2. Полный сброс параметров
    started = true;
    paused = false;
    score = 0;
    baseAmmo = 100; // Энергия турелей
    lives = 3;
    curMission = 0;
    missionProgress = 0;
    shieldActive = false;

    // 3. Сброс игрока
    snake.x = BASE_POS.x + 50; 
    snake.y = BASE_POS.y + 50;
    snake.segments = [];
    snake.length = 25; // Начальная длина
    for(let i=0; i < snake.length; i++) {
        snake.segments.push({x: snake.x, y: snake.y});
    }

    // 4. Очистка массивов (Гарантия чистого экрана)
    entities.food = [];
    entities.enemies = [];
    entities.particles = [];
    entities.turrets = [];
    entities.bullets = [];
    entities.drones = [];
    entities.loot = [];
    entities.boss = null;

    // Первичный спавн еды
    for(let i=0; i<15; i++) spawnFood();

    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    // 5. Запуск циклов
    if (gameId) cancelAnimationFrame(gameId);
    gameId = requestAnimationFrame(gameLoop);
    updateMission();
    updateUI();

    // 6. Таймер расхода патронов (если есть турели)
    if (window.ammoInt) clearInterval(window.ammoInt);
    window.ammoInt = setInterval(() => { 
        if(started && !paused && curMission > 0) {
            // Если на карте есть враги или турели - энергия медленно тает
            if(entities.turrets.length > 0 || entities.enemies.length > 0) {
                baseAmmo = Math.max(0, baseAmmo - 0.4); 
            }
            if(baseAmmo <= 0) updateUI(); // Турели перестанут стрелять в update()
            updateUI(); 
        }
    }, 1000);
}

/** --- СИСТЕМА УРОВНЕЙ (МИССИИ) --- */
const baseMissions = [
    { t: "Защищай базу: съешь первый голубой байт", check: () => missionProgress >= 1 },
    { t: "Перехват: Уничтожь 1 Глюк ГОЛОВОЙ (+2 к длине)", check: () => missionProgress >= 1 },
    { t: "Защита: Собери 1200 CR на Пушку", check: () => score >= 1200 },
    { t: "Установка: Купи ПУШКУ в магазине", check: () => entities.turrets.length > 0 },
    { t: "Зарядка: Коснись Ядра, чтобы отдать массу Турелям", check: () => missionProgress >= 1 }
];

function getMission(id) {
    if (id < baseMissions.length) return baseMissions[id];
    // Генератор бесконечных уровней
    const types = [
        { t: "Уровень {id}: Уничтожь {goal} Глюков", goal: 5+id, check: () => missionProgress >= 5+id },
        { t: "Уровень {id}: Собери {goal} байтов данных", goal: 10+id, check: () => missionProgress >= 10+id },
        { t: "Уровень {id}: Пополни заряд базы 3 раза", goal: 3, check: () => missionProgress >= 3 }
    ];
    let res = types[id % types.length];
    return { t: res.t.replace("{id}", id + 1).replace("{goal}", res.goal), check: res.check };
}

function updateMission() {
    const m = getMission(curMission);
    const mId = document.getElementById('m-id');
    const mText = document.getElementById('mission-text');
    if(mId) mId.innerText = curMission + 1;
    if(mText) mText.innerText = m.t;
    
    if (m.check()) {
        curMission++; missionProgress = 0;
        if(curMission === 3 && !paused) toggleShop(true); 
        updateMission();
    }
}

/** --- МАГАЗИН И МОДЕРНИЗАЦИЯ --- */
function buyUpgrade(type, cost) {
    if (score < cost) return;
    
    if (type === 'turret') {
        score -= cost;
        const ang = Math.random() * 6.28;
        entities.turrets.push({ x: BASE_POS.x + Math.cos(ang)*165, y: BASE_POS.y + Math.sin(ang)*165, type: 'bolt', lastShot: 0 });
    } else if (type === 'laser') {
        let t = entities.turrets.find(t => t.type === 'bolt');
        if (t) { score -= cost; t.type = 'laser'; }
    } else if (type === 'drone') {
        score -= cost;
        entities.drones.push({ angle: Math.random()*6.28, dist: 140 + Math.random()*40 });
    } else if (type === 'fix') {
        if (lives < 3) { score -= cost; lives++; }
    }
    updateUI();
}

function updateUI() {
    const bar = document.getElementById('signal-bar');
    if (bar) {
        bar.style.width = baseAmmo + '%';
        bar.style.background = baseAmmo < 30 ? 'var(--neon-red)' : 'var(--neon-blue)';
    }
    const sv = document.getElementById('score-val');
    const sc = document.getElementById('shop-credits');
    const lv = document.getElementById('lives-val');
    if(sv) sv.innerText = Math.floor(score);
    if(sc) sc.innerText = Math.floor(score);
    if(lv) lv.innerText = lives;
}

/** --- ЦИКЛ ОБНОВЛЕНИЯ (UPDATE) --- */
function update() {
    if(!started || paused) return;
    frameCount++;
    updateMission();

    // 1. Движение змеи
    if(input.x || input.y) snake.angle = Math.atan2(input.y, input.x);
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;

    // Loop Мира (Червоточины)
    if(snake.x < 0) snake.x = WORLD_SIZE; if(snake.x > WORLD_SIZE) snake.x = 0;
    if(snake.y < 0) snake.y = WORLD_SIZE; if(snake.y > WORLD_SIZE) snake.y = 0;

    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    // 2. Механика: Кормление Базы (Пополнение патронов)
    const distToCore = Math.hypot(snake.x - BASE_POS.x, snake.y - BASE_POS.y);
    if(distToCore < 80 && baseAmmo < 100 && snake.length > 12) {
        snake.length -= 0.2; // Отдаем массу
        baseAmmo = Math.min(100, baseAmmo + 1.5); // Заряжаем турели
        if(curMission === 4) missionProgress = 1;
        updateUI();
    }
    // 3. Камера
    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    // 4. Отработка защиты (Специализация + Расход патронов)
    if (baseAmmo > 0) {
        entities.turrets.forEach(t => {
            if (t.type === 'bolt') {
                if (Date.now() - t.lastShot > 1700 && entities.bullets.length < 15) {
                    let target = entities.enemies.find(en => en.type === 'box');
                    if (target && Math.hypot(t.x - target.x, t.y - target.y) < 1000) {
                        const a = Math.atan2(target.y - t.y, target.x - t.x);
                        entities.bullets.push({x: t.x, y: t.y, vx: Math.cos(a)*16, vy: Math.sin(a)*16});
                        t.lastShot = Date.now();
                        baseAmmo -= 0.5; // Расход за выстрел
                    }
                }
            } else if (t.type === 'laser') {
                if (Date.now() - t.lastShot > 2500) {
                    let target = entities.enemies.find(en => en.type === 'tri');
                    if (target && Math.hypot(t.x - target.x, t.y - target.y) < 1600) {
                        t.activeLaser = { x: target.x, y: target.y, time: Date.now() + 150 };
                        // Лазер создает обломок (Loot Decay)
                        entities.loot.push({x: target.x, y: target.y, dieTime: Date.now() + 5000});
                        entities.enemies = entities.enemies.filter(e => e !== target);
                        score += 90; t.lastShot = Date.now();
                        baseAmmo -= 2; // Лазер дороже
                    }
                }
            }
        });
    }

    // 5. Дроны
    entities.drones.forEach(d => {
        d.angle += 0.04;
        const dx = BASE_POS.x + Math.cos(d.angle) * d.dist;
        const dy = BASE_POS.y + Math.sin(d.angle) * d.dist;
        d.x = dx; d.y = dy;
        entities.enemies.forEach((en, ei) => {
            if(Math.hypot(en.x - dx, en.y - dy) < 55) {
                entities.enemies.splice(ei, 1);
                entities.loot.push({x: en.x, y: en.y, dieTime: Date.now() + 5000});
                score += 40;
            }
        });
    });

    // 6. Снаряды
    entities.bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if(Math.hypot(b.x - BASE_POS.x, b.y - BASE_POS.y) > 2500) entities.bullets.splice(i,1);
    });

    // 7. Враги (Глюки)
    if(started && curMission >= 1 && Math.random() < (0.0075 + (curMission * 0.0003))) spawnEnemy();

    entities.enemies.forEach((en, i) => {
        const ang = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(ang) * en.speed;
        en.y += Math.sin(ang) * en.speed;

        // Пуля vs Враг (Механика Loot Decay)
        entities.bullets.forEach((b, bi) => {
            if(Math.hypot(b.x - en.x, b.y - en.y) < 45) {
                entities.enemies.splice(i,1); 
                entities.bullets.splice(bi,1);
                // При смерти от пули выпадает обломок (+1 длина)
                entities.loot.push({x: en.x, y: en.y, dieTime: Date.now() + 5000});
                score += 50; 
                if(curMission >= 5) missionProgress++;
                createParticles(en.x, en.y, 'blue', 5);
            }
        });

        // Ядро vs Враг
        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 70) {
            if (shieldActive) { shieldActive = false; createParticles(BASE_POS.x, BASE_POS.y, 'cyan', 25); }
            else { lives--; }
            entities.enemies.splice(i, 1);
            if(lives <= 0) gameOver();
            updateUI();
        }

        // Змея vs Враг (Убийство ГОЛОВОЙ)
        if(Math.hypot(en.x - snake.x, en.y - snake.y) < 55) {
            score += 100;
            // Прямое поедание дает +2 к длине
            snake.length += 2; 
            entities.enemies.splice(i, 1);
            createParticles(en.x, en.y, 'green', 10);
            if(curMission === 1) missionProgress++; 
            updateUI();
        }
    });

    // 8. Обломки (Loot Decay)
    entities.loot.forEach((l, i) => {
        if (Date.now() > l.dieTime) { entities.loot.splice(i, 1); return; }
        if (Math.hypot(l.x - snake.x, l.y - snake.y) < 60) {
            snake.length += 1; // Обломок дает меньше, чем живой враг
            entities.loot.splice(i, 1);
            score += 10;
            updateUI();
        }
    });

    // 9. Бабайты (Еда)
    entities.food.forEach((f, i) => {
        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 65) { 
            snake.length += 4; score += 35;
            entities.food.splice(i, 1); spawnFood();
            if(curMission === 0) missionProgress++;
            updateUI();
        }
    });

    // 10. Частицы
    entities.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.03;
        if(p.life <= 0) entities.particles.splice(i, 1);
    });
}

/** --- ОТРИСОВКА --- */
function gameLoop() {
    if(!started || paused) return;
    update();
    draw();
    gameId = requestAnimationFrame(gameLoop);
}

function draw() {
    if(!ctx) return;
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-camera.x, -camera.y);

    // Сетка
    ctx.strokeStyle = '#112'; ctx.lineWidth = 10;
    for(let i=0; i<=WORLD_SIZE; i+=1000) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    // 1. Ядро
    if(shieldActive) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)'; ctx.lineWidth = 15;
        ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 115, 0, 6.28); ctx.stroke();
    }
    ctx.shadowBlur = 40; ctx.shadowColor = '#00f3ff';
    ctx.fillStyle = '#0a0a1a'; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 65, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 6; ctx.stroke();
    ctx.shadowBlur = 0;

    // 2. РАДАР (FIX: Остановка у края Ядра 65px)
    entities.enemies.forEach(en => {
        const ang = Math.atan2(en.y - BASE_POS.y, en.x - BASE_POS.x);
        const realDist = Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y);
        // Метка не заходит внутрь (минимум 65) и не улетает далеко (максимум 150)
        const radarDist = Math.max(65, Math.min(150, realDist * 0.05));
        
        ctx.save();
        ctx.translate(BASE_POS.x, BASE_POS.y);
        ctx.rotate(ang);
        ctx.fillStyle = '#ff0055';
        if(en.type === 'box') { ctx.fillRect(radarDist, -8, 16, 16); }
        else { ctx.beginPath(); ctx.moveTo(radarDist, -10); ctx.lineTo(radarDist + 20, 0); ctx.lineTo(radarDist, 10); ctx.fill(); }
        ctx.restore();
    });

    // 3. Турели и Лазеры
    entities.turrets.forEach(t => {
        ctx.fillStyle = '#fff'; ctx.fillRect(t.x-25, t.y-25, 50, 50);
        ctx.strokeStyle = t.type === 'laser' ? '#bc13fe' : '#00f3ff';
        ctx.lineWidth = 4; ctx.strokeRect(t.x-25, t.y-25, 50, 50);
        if (t.type === 'laser' && t.activeLaser && t.activeLaser.time > Date.now()) {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.activeLaser.x, t.activeLaser.y); ctx.stroke();
            ctx.strokeStyle = '#bc13fe'; ctx.lineWidth = 5; ctx.stroke();
        }
    });

    // 4. Объекты (Пули, Еда, Враги, Обломки)
    ctx.fillStyle = 'yellow'; entities.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 6.28); ctx.fill(); });
    ctx.fillStyle = '#00f3ff'; entities.food.forEach(f => { ctx.beginPath(); ctx.arc(f.x, f.y, 22, 0, 6.28); ctx.fill(); });
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; entities.loot.forEach(l => { ctx.fillRect(l.x-10, l.y-10, 20, 20); });
    
    entities.enemies.forEach(en => {
        ctx.fillStyle = '#ff0055'; 
        if(en.type === 'tri') { ctx.beginPath(); ctx.moveTo(en.x, en.y-45); ctx.lineTo(en.x+35, en.y+20); ctx.lineTo(en.x-35, en.y+20); ctx.fill(); }
        else { ctx.fillRect(en.x-35, en.y-35, 70, 70); }
    });

    // 5. Змейка
    ctx.fillStyle = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const r = (snake.size * (1 - i / snake.segments.length)) + 5;
        ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, 6.28); ctx.fill();
    });

    // 6. Компас
    const baseAng = Math.atan2(BASE_POS.y - snake.y, BASE_POS.x - snake.x);
    ctx.save(); ctx.translate(snake.x, snake.y); ctx.rotate(baseAng);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.7)';
    ctx.beginPath(); ctx.moveTo(85, 0); ctx.lineTo(60, -15); ctx.lineTo(60, 15); ctx.fill();
    ctx.restore();

    // 7. Частицы
    entities.particles.forEach(p => {
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 12, 12);
    });
    ctx.globalAlpha = 1.0; ctx.restore();
}

/** --- ГЕНЕРАТОРЫ --- */
function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0) {x=Math.random()*WORLD_SIZE; y=-250;}
    else if(side===1) {x=WORLD_SIZE+250; y=Math.random()*WORLD_SIZE;}
    else if(side===2) {x=Math.random()*WORLD_SIZE; y=WORLD_SIZE+250;}
    else {x=-250; y=Math.random()*WORLD_SIZE;}
    const isTri = Math.random() > 0.75;
    entities.enemies.push({ x, y, speed: isTri ? 3.4 : 1.7, type: isTri ? 'tri' : 'box' });
}

function spawnFood() {
    entities.food.push({ x: 500+Math.random()*(WORLD_SIZE-1000), y: 500+Math.random()*(WORLD_SIZE-1000) });
}

function createParticles(x, y, color, count) {
    if (entities.particles.length > 50) return;
    for(let i=0; i<count; i++) {
        entities.particles.push({ x, y, color, vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25, life: 1.0 });
    }
}

function gameOver() {
    started = false;
    if(window.ammoInt) clearInterval(window.ammoInt);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-stats').innerText = "Уровней пройдено: " + curMission + " | Счет: " + Math.floor(score);
}

/** --- ДЖОЙСТИК --- */
function initJoystick() {
    const zone = document.getElementById('joystick-zone'), stick = document.getElementById('joystick-stick');
    let active = false;
    const handle = (e) => {
        if(!active) return;
        const t = e.touches ? e.touches[0] : e;
        const r = zone.getBoundingClientRect();
        const cX = r.left + r.width/2, cY = r.top + r.height/2;
        let dx = t.clientX - cX, dy = t.clientY - cY;
        const dist = Math.min(r.width/2, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
        stick.style.left = `calc(50% + ${Math.cos(ang)*dist}px)`;
        stick.style.top = `calc(50% + ${Math.sin(ang)*dist}px)`;
        input.x = Math.cos(ang); input.y = Math.sin(ang);
    };
    zone.addEventListener('touchstart', e => { active = true; handle(e); e.preventDefault(); }, {passive: false});
    window.addEventListener('touchmove', e => { if(active) { handle(e); e.preventDefault(); } }, {passive: false});
    window.addEventListener('touchend', () => { active = false; stick.style.left='50%'; stick.style.top='50%'; input.x=0; input.y=0; });
}

// ПРЯМОЙ ЗАПУСК
init();
</script>
