<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="neon-bg"></div>
    <div class="scanlines"></div>

    <!-- ВЕРХНЯЯ ЗОНА (НОВЫЙ ДИЗАЙН) -->
    <div class="fixed-top-area">
        
        <!-- ПЛЕЕР: СЕТКА -->
        <div class="inline-player new-layout">
            <!-- Левая колонка -->
            <div class="player-info-col">
                <!-- Строка 1: Имя + Громкость -->
                <div class="top-row">
                    <div class="logo-small">LEPOTA<span class="neon-text">FM</span></div>
                    <div class="vol-mini-container">
                        <i class="fas fa-volume-down tiny-icon"></i>
                        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
                <!-- Строка 2: Бегущая строка -->
                <div class="bot-row">
                    <div class="marquee-container">
                        <div class="marquee-content">
                            <span id="track-name">Загрузка...</span>
                            <span class="separator" id="track-sep"> - </span>
                            <span id="artist-name">LepotaFM</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: ПЛЕЙ (КРУГЛЫЙ С КАРТИНКОЙ) -->
            <div class="player-btn-col">
                <button id="play-btn" class="big-play-btn">
                    <img id="mini-art" src="logo.jpg" alt="Art" onerror="this.src='logo.jpg'">
                    <span class="icon-overlay"><i class="fas fa-play" id="play-icon"></i></span>
                </button>
            </div>
        </div>

        <!-- 4 ВКЛАДКИ -->
        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab('home', this)">Главная</button>
            <button class="tab-btn" onclick="openTab('games', this)">Игры</button>
            <button class="tab-btn" onclick="openTab('ether', this)">Эфир</button>
            <button class="tab-btn" onclick="openTab('menu', this)">Меню</button>
        </nav>
    </div>

    <!-- НИЖНЯЯ ЗОНА -->
    <div class="main-content">
        
        <!-- 1. ГЛАВНАЯ (Бывшее Послание/Студия) -->
        <div id="home" class="tab-pane active">
            <div class="placeholder-box">
                <i class="fab fa-telegram-plane" style="font-size: 40px; color: #0088cc; margin-bottom: 15px;"></i>
                <h3>Студия</h3>
                <p>Написать ведущему или заказать песню</p>
                <a href="https://t.me/lepotafm" target="_blank" class="neon-btn">Открыть Telegram</a>
            </div>
        </div>

        <!-- 2. ИГРЫ (Новая вкладка) -->
        <div id="games" class="tab-pane">
            <div class="placeholder-box">
                <i class="fas fa-gamepad" style="font-size: 40px; color: var(--neon-pink); margin-bottom: 15px;"></i>
                <h3>Игры</h3>
                <p>Раздел в разработке...</p>
            </div>
        </div>

        <!-- 3. ЭФИР (История треков) -->
        <div id="ether" class="tab-pane">
            <div class="history-list" id="history-container">
                <div class="loading-msg">
                    <i class="fas fa-circle-notch fa-spin"></i> Загрузка...
                </div>
            </div>
        </div>

        <!-- 4. МЕНЮ (Бывшие Фичи + Настройки) -->
        <div id="menu" class="tab-pane">
            <div class="settings-box">
                
                <!-- ТАЙМЕР СНА -->
                <div class="feature-card">
                    <div class="feature-header"><i class="fas fa-moon"></i> Таймер сна</div>
                    <div class="timer-slider-box">
                        <div class="timer-display"><span id="timer-val-display">Off</span></div>
                        <input type="range" id="sleep-slider" min="0" max="180" step="15" value="0" oninput="updateSleepLabel(this.value)" onchange="setSleepTimer(this.value)">
                        <div class="slider-labels"><span>0</span><span>3ч</span></div>
                    </div>
                    <div id="sleep-status" class="status-hidden">
                        Стоп через: <span id="sleep-countdown" class="neon-text">00:00</span>
                    </div>
                </div>

                <!-- БУДИЛЬНИК -->
                <div class="feature-card">
                    <div class="feature-header"><i class="fas fa-clock"></i> Будильники</div>
                    <div class="alarm-create-box">
                        <input type="time" id="new-alarm-time" class="neon-input">
                        <div class="days-selector">
                            <span class="day-check" data-day="1" onclick="toggleDay(this)">Пн</span>
                            <span class="day-check" data-day="2" onclick="toggleDay(this)">Вт</span>
                            <span class="day-check" data-day="3" onclick="toggleDay(this)">Ср</span>
                            <span class="day-check" data-day="4" onclick="toggleDay(this)">Чт</span>
                            <span class="day-check" data-day="5" onclick="toggleDay(this)">Пт</span>
                            <span class="day-check" data-day="6" onclick="toggleDay(this)">Сб</span>
                            <span class="day-check" data-day="0" onclick="toggleDay(this)">Вс</span>
                        </div>
                        <button class="add-alarm-btn" onclick="addAlarm()">+ Добавить</button>
                    </div>
                    <div id="alarms-list"></div>
                    <div id="alarm-msg" class="status-hidden">⏰ ПОДЪЕМ!</div>
                </div>

                <!-- Пункт "Высокое качество" УДАЛЕН -->
                
                <div class="placeholder-box" style="padding: 20px 0;">
                     <p style="font-size: 12px; color: #666;">Версия: Final Fix</p>
                </div>
            </div>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО ИНФОРМАЦИИ -->
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" onclick="closeSku()">✕</button>
            <img id="modal-art" src="logo.jpg" alt="Art">
            <h2 id="modal-title">Название</h2>
            <p id="modal-artist">Артист</p>
            
            <div class="modal-actions">
                <a href="https://vk.com/public213919632" target="_blank" class="action-btn vk">
                    <i class="fab fa-vk"></i> Группа ВКонтакте
                </a>
                <a href="https://t.me/lepotafm" target="_blank" class="action-btn tg">
                    <i class="fab fa-telegram-plane"></i> Написать Админу
                </a>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
