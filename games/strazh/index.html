<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signal Defender 9.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon-green: #39ff14; --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-purple: #bc13fe; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stat-box { position: absolute; background: rgba(5, 5, 20, 0.9); padding: 8px 12px; border: 1px solid var(--neon-blue); border-radius: 10px; pointer-events: auto; font-size: 11px; }
        #top-left { top: 65px; left: 15px; }
        #top-right { top: 65px; right: 15px; text-align: right; }

        .app-controls { position: absolute; top: 0; left: 0; right: 0; height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #0f0f1e; border-bottom: 2px solid var(--neon-purple); pointer-events: auto; }
        .control-btn { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-blue); border-radius: 50%; color: var(--neon-blue); display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #joystick-zone { position: absolute; bottom: 50px; right: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: var(--neon-blue); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--neon-blue); }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .shop-content { width: 90%; max-width: 380px; background: #0a0a1a; border: 1px solid var(--neon-blue); padding: 20px; border-radius: 20px; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .shop-item { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; }
        .shop-item:active { background: var(--neon-purple); }
        .shop-item i { color: var(--neon-blue); font-size: 20px; margin-bottom: 5px; display: block; }

        .btn-start { padding: 12px 35px; font-size: 18px; font-weight: bold; background: none; border: 2px solid var(--neon-green); color: var(--neon-green); border-radius: 30px; cursor: pointer; box-shadow: 0 0 10px var(--neon-green); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="app-controls">
            <button class="control-btn" onclick="toggleModal(true)"><i class="fas fa-info-circle"></i></button>
            <div style="color: var(--neon-blue); font-weight: bold; font-size: 13px; letter-spacing: 2px;">SIGNAL DEFENDER 9.0</div>
            <button class="control-btn" onclick="toggleShop(true)"><i class="fas fa-shopping-cart"></i></button>
        </div>

        <div id="top-left" class="stat-box">
            <div style="font-size: 9px; margin-bottom:3px;">SIGNAL</div>
            <div style="width: 100px; height: 6px; background: #111; border-radius: 3px; border: 1px solid #333;">
                <div id="signal-bar" style="width: 100%; height: 100%; background: var(--neon-green); transition: width 0.3s;"></div>
            </div>
        </div>
        
        <div id="top-right" class="stat-box">
            <div>CORE: <span id="lives-val" style="color:var(--neon-red)">3</span></div>
            <div>DATA: <span id="score-val" style="color:var(--neon-green)">0</span></div>
        </div>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>

    <div id="info-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-blue); margin:0;">ИНФО</h2>
            <p style="font-size: 12px; color: #ccc;">Стрелки вокруг Ядра показывают направление врагов.<br>Стрелка на голове Змеи указывает на Базу.</p>
            <div style="font-size: 10px; color: var(--neon-purple); border-top: 1px dashed #444; padding-top: 10px; margin-top:10px;">
                ЛИЦЕНЗИЯ: (c) 2025 LepotaFM. Копирование запрещено.
            </div>
            <button class="btn-start" style="width:100%; margin-top:15px;" onclick="toggleModal(false)">ОК</button>
        </div>
    </div>

    <div id="shop-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-purple); text-align:center; font-size: 20px; margin:0;">UPGRADES</h2>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyUpgrade('turret', 1200)">
                    <i class="fas fa-crosshairs"></i><b>Турель</b><span>1200 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('shield', 600)">
                    <i class="fas fa-shield-alt"></i><b>Щит</b><span>600 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('fix', 2000)">
                    <i class="fas fa-tools"></i><b>Ремонт</b><span>2000 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('emp', 1000)">
                    <i class="fas fa-bolt"></i><b>ЭМИ</b><span>1000 CR</span>
                </div>
            </div>
            <button class="btn-start" style="width:100%; margin-top:20px;" onclick="toggleShop(false)">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="color:var(--neon-blue);">SIGNAL DEFENDER</h1>
        <button class="btn-start" onclick="startGame()">ИНИЦИАЛИЗАЦИЯ</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">DATA CORRUPTED</h1>
        <button class="btn-start" onclick="location.reload()">REBOOT</button>
    </div>

<script>
/** CONFIG */
const STREAM_URL = "https://lepotafm.ru/listen/lepotafm/radio.mp3";
const WORLD_SIZE = 4000; 
const BASE_POS = { x: 2000, y: 2000 };
const ZOOM = 0.35; 

/** STATE */
let canvas, ctx, started = false, paused = false, score = 0, signalLevel = 100, lives = 3;
let snake = { x: 2050, y: 2050, segments: [], angle: 0, speed: 5, size: 25, length: 15 };
let entities = { food: [], enemies: [], particles: [], turrets: [], bullets: [] };
let camera = { x: 0, y: 0 }, input = { x: 0, y: 0 };
let audioCtx, noiseGain, shieldActive = false;

function init() {
    canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
    resize(); initJoystick(); window.addEventListener('resize', resize);
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function toggleModal(s) { paused = s; document.getElementById('info-modal').classList.toggle('hidden', !s); }
function toggleShop(s) { if(!started) return; paused = s; document.getElementById('shop-modal').classList.toggle('hidden', !s); document.getElementById('score-val').innerText = score; }

function buyUpgrade(type, cost) {
    if (score < cost) return;
    score -= cost;
    if (type === 'turret') {
        const ang = Math.random() * 6.28;
        entities.turrets.push({ x: BASE_POS.x + Math.cos(ang)*150, y: BASE_POS.y + Math.sin(ang)*150, lastShot: 0 });
    }
    if (type === 'shield') shieldActive = true;
    if (type === 'fix') lives = Math.min(3, lives + 1);
    if (type === 'emp') { entities.enemies = []; createParticles(BASE_POS.x, BASE_POS.y, 'white', 50); }
    updateUI();
}

function initAudio() {
    try {
        const isInsideApp = window.self !== window.top;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (!isInsideApp) {
            const m = new Audio(STREAM_URL); m.crossOrigin="anonymous";
            const s = audioCtx.createMediaElementSource(m);
            const g = audioCtx.createGain(); s.connect(g).connect(audioCtx.destination); m.play();
        }
        const nb = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
        const o = nb.getChannelData(0); for(let i=0; i<o.length; i++) o[i]=Math.random()*2-1;
        const ns = audioCtx.createBufferSource(); ns.buffer=nb; ns.loop=true;
        noiseGain = audioCtx.createGain(); noiseGain.gain.value=0;
        ns.connect(noiseGain).connect(audioCtx.destination); ns.start();
    } catch(e) {}
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    initAudio(); started = true;
    for(let i=0; i<20; i++) spawnFood();
    requestAnimationFrame(gameLoop);
    setInterval(() => { if(started && !paused) signalLevel = Math.max(0, signalLevel-1); updateUI(); }, 1600);
}

function update() {
    if(!started || paused) return;

    if(input.x || input.y) snake.angle = Math.atan2(input.y, input.x);
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;
    snake.x = Math.max(100, Math.min(WORLD_SIZE-100, snake.x));
    snake.y = Math.max(100, Math.min(WORLD_SIZE-100, snake.y));

    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    entities.turrets.forEach(t => {
        if (Date.now() - t.lastShot > 400) { // Турели стали быстрее
            let target = entities.enemies[0];
            if (target) {
                const a = Math.atan2(target.y - t.y, target.x - t.x);
                entities.bullets.push({x: t.x, y: t.y, vx: Math.cos(a)*15, vy: Math.sin(a)*15});
                t.lastShot = Date.now();
            }
        }
    });

    entities.bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if(Math.hypot(b.x-BASE_POS.x, b.y-BASE_POS.y) > 1500) entities.bullets.splice(i,1);
    });

    if(Math.random() < 0.008) spawnEnemy(); // Реже спавн врагов

    entities.enemies.forEach((en, i) => {
        const ang = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(ang) * en.speed; en.y += Math.sin(ang) * en.speed;

        entities.bullets.forEach((b, bi) => {
            if(Math.hypot(b.x-en.x, b.y-en.y) < 30) {
                entities.enemies.splice(i,1); entities.bullets.splice(bi,1);
                score += 50; createParticles(en.x, en.y, 'blue', 10);
            }
        });

        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 60) {
            if (shieldActive) shieldActive = false; else lives--;
            entities.enemies.splice(i, 1); createParticles(en.x, en.y, 'red', 20);
            if(lives <= 0) gameOver(); updateUI();
        }

        if(Math.hypot(en.x - snake.x, en.y - snake.y) < 40) {
            score += 100; entities.enemies.splice(i, 1); createParticles(en.x, en.y, 'green', 15);
            updateUI();
        }
    });

    entities.food.forEach((f, i) => {
        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 45) {
            signalLevel = Math.min(100, signalLevel + 20);
            snake.length += 3; score += 25;
            entities.food.splice(i, 1); spawnFood();
            createParticles(f.x, f.y, 'cyan', 10); updateUI();
        }
    });

    entities.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if(p.life <= 0) entities.particles.splice(i, 1);
    });

    if(audioCtx && noiseGain) {
        let nv = signalLevel > 50 ? 0 : (50 - signalLevel) / 50;
        noiseGain.gain.setTargetAtTime(nv * 0.15, audioCtx.currentTime, 0.1);
    }
}

function draw() {
    ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(-camera.x, -camera.y);

    // СЕТКА
    ctx.strokeStyle = '#112'; ctx.lineWidth = 5;
    for(let i=0; i<=WORLD_SIZE; i+=500) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    // ЯДРО (БАЗА)
    ctx.shadowBlur = 40; ctx.shadowColor = 'cyan';
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 60, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'cyan'; ctx.lineWidth = 5; ctx.stroke();
    if(shieldActive) { ctx.strokeStyle = 'rgba(0, 243, 255, 0.5)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 110, 0, 6.28); ctx.stroke(); }

    // КРУГОВОЙ РАДАР УГРОЗ (Вокруг ядра)
    entities.enemies.forEach(en => {
        const ang = Math.atan2(en.y - BASE_POS.y, en.x - BASE_POS.x);
        ctx.save();
        ctx.translate(BASE_POS.x, BASE_POS.y);
        ctx.rotate(ang);
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.moveTo(150, -10); ctx.lineTo(170, 0); ctx.lineTo(150, 10);
        ctx.fill();
        ctx.restore();
    });

    // ТУРЕЛИ И ПУЛИ
    ctx.fillStyle = '#fff'; entities.turrets.forEach(t => ctx.fillRect(t.x-20, t.y-20, 40, 40));
    ctx.fillStyle = 'yellow'; entities.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, 6.28); ctx.fill(); });

    // ЕДА И ВРАГИ
    entities.food.forEach(f => { ctx.fillStyle = 'cyan'; ctx.beginPath(); ctx.arc(f.x, f.y, 15, 0, 6.28); ctx.fill(); });
    entities.enemies.forEach(en => { ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff0055'; ctx.fillRect(en.x-30, en.y-30, 60, 60); });

    // ЗМЕЙКА
    ctx.shadowBlur = 25; ctx.shadowColor = '#39ff14'; ctx.fillStyle = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const r = (snake.size * (1 - i / snake.segments.length)) + 5;
        ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, 6.28); ctx.fill();
    });

    // КОМПАС (На голове змеи, показывает на базу)
    const baseAng = Math.atan2(BASE_POS.y - snake.y, BASE_POS.x - snake.x);
    ctx.save(); ctx.translate(snake.x, snake.y); ctx.rotate(baseAng);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.5)';
    ctx.beginPath(); ctx.moveTo(50, 0); ctx.lineTo(40, -5); ctx.lineTo(40, 5); ctx.fill();
    ctx.restore();

    entities.particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 10, 10); });
    ctx.restore();
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0) {x=Math.random()*WORLD_SIZE; y=-200;}
    else if(side===1) {x=WORLD_SIZE+200; y=Math.random()*WORLD_SIZE;}
    else if(side===2) {x=Math.random()*WORLD_SIZE; y=WORLD_SIZE+200;}
    else {x=-200; y=Math.random()*WORLD_SIZE;}
    entities.enemies.push({ x, y, speed: 1.3 + Math.random() });
}
function spawnFood() { entities.food.push({ x: 300 + Math.random()*(WORLD_SIZE-600), y: 300 + Math.random()*(WORLD_SIZE-600) }); }
function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) entities.particles.push({ x, y, color, vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25, life: 1.0 });
}
function updateUI() {
    document.getElementById('signal-bar').style.width = signalLevel + '%';
    document.getElementById('lives-val').innerText = lives;
    document.getElementById('score-val').innerText = score;
}
function gameOver() { started = false; document.getElementById('game-over-screen').classList.remove('hidden'); }
function gameLoop() { if(!started || paused) return; update(); draw(); requestAnimationFrame(gameLoop); }
function togglePause() { if(!started) return; paused = !paused; if(!paused) gameLoop(); }

function initJoystick() {
    const zone = document.getElementById('joystick-zone'), stick = document.getElementById('joystick-stick');
    let active = false;
    const handle = (e) => {
        if(!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width/2, centerY = rect.top + rect.height/2;
        let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
        const dist = Math.min(rect.width/2, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
        stick.style.left = `calc(50% + ${Math.cos(ang)*dist}px)`; stick.style.top = `calc(50% + ${Math.sin(ang)*dist}px)`;
        input.x = Math.cos(ang); input.y = Math.sin(ang);
    };
    zone.addEventListener('touchstart', (e) => { active = true; handle(e); });
    window.addEventListener('touchmove', handle, {passive:false});
    window.addEventListener('touchend', () => { active = false; stick.style.left='50%'; stick.style.top='50%'; input.x=0; input.y=0; });
}
init();
</script>
</body>
</html>
