<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="neon-bg"></div>
    <div class="scanlines"></div>

    <!-- ВЕРХНЯЯ ЗОНА (ПЛЕЕР + ТАБЫ) -->
    <div class="fixed-top-area">
        
        <!-- Плеер -->
        <div class="inline-player">
            <div class="player-info-col">
                <div class="top-row">
                    <div class="logo-small">LEPOTA<span class="neon-text">FM</span></div>
                    <div class="vol-mini-container">
                        <i class="fas fa-volume-down tiny-icon"></i>
                        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
                <div class="bot-row">
                    <div class="marquee-container">
                        <div class="marquee-content">
                            <span id="track-name">Загрузка...</span>
                            <span class="separator" id="track-sep"> - </span>
                            <span id="artist-name">LepotaFM</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="player-btn-col">
                <button id="play-btn" class="big-play-btn">
                    <img id="mini-art" src="logo.jpg" alt="Art" onerror="this.src='logo.jpg'">
                    <span class="icon-overlay"><i class="fas fa-play" id="play-icon"></i></span>
                </button>
            </div>
        </div>

        <!-- Табы (Перенесли сюда, как ты просил) -->
        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab('home', this)">Игра</button>
            <button class="tab-btn" onclick="openTab('catalog', this)">Каталог</button>
            <button class="tab-btn" onclick="openTab('ether', this)">Эфир</button>
            <button class="tab-btn" onclick="openTab('menu', this)">Меню</button>
        </nav>
    </div>

    <!-- НИЖНЯЯ ЗОНА (КОНТЕНТ) -->
    <div class="main-content">
        
        <!-- 1. ИГРА (Iframe) -->
        <div id="home" class="tab-pane active full-height">
            <!-- Сюда вставляем игру. Пока стоит заглушка, чтобы ты видел, что работает -->
            <iframe id="game-frame" src="game/index.html" frameborder="0"></iframe>
        </div>

        <!-- 2. КАТАЛОГ -->
        <div id="catalog" class="tab-pane">
            <div class="placeholder-box">
                <h3>Каталог игр</h3>
                <p>Скоро...</p>
            </div>
        </div>

        <!-- 3. ЭФИР -->
        <div id="ether" class="tab-pane">
            <div class="history-list" id="history-container">
                <div class="loading-msg">Загрузка...</div>
            </div>
        </div>

        <!-- 4. МЕНЮ -->
        <div id="menu" class="tab-pane">
            <div class="settings-box">
                <!-- ТАЙМЕР -->
                <div class="feature-card">
                    <div class="feature-header"><i class="fas fa-moon"></i> Таймер сна</div>
                    <div class="timer-slider-box">
                        <div class="timer-display"><span id="timer-val-display">Off</span></div>
                        <input type="range" id="sleep-slider" min="0" max="180" step="15" value="0" oninput="updateSleepLabel(this.value)" onchange="setSleepTimer(this.value)">
                        <div class="slider-labels"><span>0</span><span>3ч</span></div>
                    </div>
                    <div id="sleep-status" class="status-hidden">
                        Стоп: <span id="sleep-countdown" class="neon-text">00:00</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- МОДАЛКА -->
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" onclick="closeSku()">✕</button>
            <img id="modal-art" src="logo.jpg">
            <h2 id="modal-title">...</h2>
            <p id="modal-artist">...</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
