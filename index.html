<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="neon-bg"></div>
    <div class="scanlines"></div>

    <!-- ВЕРХНЯЯ ЗОНА -->
    <div class="fixed-top-area">
        <header>
            <div class="logo">LEPOTA<span class="neon-text">FM</span></div>
            <div class="live-indicator">LIVE</div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab('ether', this)">Эфир</button>
            <button class="tab-btn" onclick="openTab('chat', this)">Чат</button>
            <button class="tab-btn" onclick="openTab('features', this)">Фичи</button>
            <button class="tab-btn" onclick="alert('Скоро!')">Shop</button>
        </nav>

        <div class="inline-player">
            <img id="mini-art" src="logo.jpg" alt="Art" onerror="this.src='logo.jpg'">
            <div class="player-info">
                <div id="track-name">LepotaFM</div>
                <div id="artist-name">Лучшая музыка</div>
            </div>
            <button id="play-btn" class="control-btn">
                <i class="fas fa-play" id="play-icon"></i>
            </button>
        </div>
    </div>

    <!-- КОНТЕНТ -->
    <div class="main-content">
        
        <!-- ЭФИР -->
        <div id="ether" class="tab-pane active">
            <div class="history-list" id="history-container">
                <div class="loading-msg">
                    <i class="fas fa-circle-notch fa-spin"></i> Загрузка истории...
                </div>
            </div>
        </div>

        <!-- ЧАТ -->
        <div id="chat" class="tab-pane">
            <div class="placeholder-box">
                <i class="fab fa-telegram-plane"></i>
                <p>Наш Telegram чат</p>
                <a href="https://t.me/lepotafm" target="_blank" class="neon-btn">Перейти</a>
            </div>
        </div>

        <!-- ФИЧИ (Настройки + Будильник + Таймер) -->
        <div id="features" class="tab-pane">
            <div class="settings-box">
                
                <!-- 1. Основная громкость -->
                <div class="setting-row volume-row">
                    <span>Громкость</span>
                    <div class="vol-control">
                        <i class="fas fa-volume-down"></i>
                        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                        <i class="fas fa-volume-up"></i>
                    </div>
                </div>

                <!-- 2. ТАЙМЕР СНА -->
                <div class="feature-block">
                    <div class="feature-header">
                        <i class="fas fa-moon"></i> Таймер сна
                    </div>
                    <div class="timer-controls">
                        <select id="sleep-select" class="neon-select">
                            <option value="0">Выкл</option>
                            <option value="15">15 мин</option>
                            <option value="30">30 мин</option>
                            <option value="60">60 мин</option>
                            <option value="90">90 мин</option>
                        </select>
                        <div id="sleep-countdown" class="status-text">Не активен</div>
                    </div>
                </div>

                <!-- 3. БУДИЛЬНИК -->
                <div class="feature-block">
                    <div class="feature-header">
                        <i class="fas fa-clock"></i> Будильник
                    </div>
                    
                    <div class="setting-row">
                        <span>Включить</span>
                        <label class="switch">
                            <input type="checkbox" id="alarm-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="alarm-controls">
                        <label>Время:</label>
                        <input type="time" id="alarm-time" class="neon-input">
                    </div>

                    <div class="setting-row volume-row">
                        <span style="font-size: 12px;">Громкость будильника</span>
                        <input type="range" id="alarm-vol" min="0" max="1" step="0.01" value="0.8">
                    </div>
                </div>

                <!-- Остальное -->
                <div class="setting-row">
                    <span>Высокое качество</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
