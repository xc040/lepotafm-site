<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Страж Эфира</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; touch-action: none; }
        .game-controls { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(21, 21, 37, 0.95); border-bottom: 1px solid rgba(188, 19, 254, 0.3); z-index: 1000; }
        .control-btn { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05); border: 1px solid #bc13fe; border-radius: 50%; color: #bc13fe; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; }
        .game-title-container { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        .game-title-mini { color: #bc13fe; font-size: 12px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 8px #bc13fe; animation: pulse 2s infinite; text-transform: uppercase; }
        @keyframes pulse { 0% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0.8; transform: scale(1); } }
        .game-score { font-size: 10px; color: #00f3ff; text-transform: uppercase; font-weight: bold; }
        canvas { border: 1px solid #333; background: #050510; box-shadow: 0 0 25px rgba(188, 19, 254, 0.15); max-width: 95vw; max-height: 75vh; position: relative; z-index: 1; margin-top: 40px; border-radius: 4px; }
        .start-msg { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #bc13fe; pointer-events: none; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px black; z-index: 10; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; border: 1px solid #bc13fe; }
        .paused-text { display: none; position: absolute; top: 50%; font-size: 35px; color: #00f3ff; font-weight: bold; text-shadow: 0 0 15px black; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>
    <div class="game-controls">
        <button class="control-btn" onclick="openTrack()"><i class="fas fa-info"></i></button>
        <div class="game-title-container" onclick="location.reload()">
            <div class="game-title-mini">СТРАЖ ЭФИРА</div>
            <div class="game-score">Очки: <span id="score-val">0</span></div>
        </div>
        <button class="control-btn" onclick="toggleP()"><i class="fas fa-pause" id="p-icon"></i></button>
    </div>
    <div class="start-msg" id="msg">Нажми для начала<br>ОХОТЫ</div>
    <div class="paused-text" id="p-msg">ПАУЗА</div>
    <canvas width="320" height="320" id="g"></canvas>
    <script>
        var canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        var grid = 16, count = 0, score = 0, gameId;
        var snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], max: 4 };
        var apple = { x: 320, y: 320 };
        var started = false, paused = false;
        function rnd(min, max) { return Math.floor(Math.random() * (max - min)) + min; }
        function openTrack() { if(window.parent && window.parent.openSku) window.parent.openSku(window.parent.document.getElementById('track-name').innerText, window.parent.document.getElementById('artist-name').innerText, window.parent.document.getElementById('mini-art').src); }
        document.body.onclick = function(e) { if(!e.target.closest('.control-btn') && !started) { started = true; document.getElementById('msg').style.display='none'; loop(); } };
        function toggleP() { if(!started) return; paused = !paused; document.getElementById('p-icon').className = paused ? "fas fa-play" : "fas fa-pause"; document.getElementById('p-msg').style.display = paused ? "block" : "none"; if(!paused) loop(); }
        window.setGamePause = function(s) { if(started && s && !paused) toggleP(); };
        function loop() {
            if(paused || !started) return;
            gameId = requestAnimationFrame(loop);
            if(++count < 6) return;
            count = 0; ctx.clearRect(0,0,canvas.width,canvas.height);
            snake.x += snake.dx; snake.y += snake.dy;
            if(snake.x<0) snake.x=canvas.width-grid; else if(snake.x>=canvas.width) snake.x=0;
            if(snake.y<0) snake.y=canvas.height-grid; else if(snake.y>=canvas.height) snake.y=0;
            snake.cells.unshift({x:snake.x, y:snake.y});
            if(snake.cells.length > snake.max) snake.cells.pop();
            ctx.fillStyle = '#00f3ff'; ctx.fillRect(apple.x, apple.y, grid-1, grid-1);
            ctx.fillStyle = '#bc13fe';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                if(cell.x === apple.x && cell.y === apple.y) {
                    snake.max++; score++; document.getElementById('score-val').innerText = score;
                    apple.x = rnd(0, 20) * grid; apple.y = rnd(0, 20) * grid;
                }
                for(var i=index+1; i<snake.cells.length; i++) {
                    if(cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        started = false; document.getElementById('msg').style.display='block';
                        document.getElementById('msg').innerHTML = "ЭФИР ПРЕРВАН<br>Очки: "+score;
                        snake={x:160,y:160,dx:grid,dy:0,cells:[],max:4}; score=0;
                    }
                }
            });
        }
        let tsX, tsY;
        document.ontouchstart = e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; };
        document.ontouchmove = e => {
