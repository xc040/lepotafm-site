<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signal Defender 13.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon-green: #39ff14; --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-purple: #bc13fe; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stat-box { position: absolute; background: rgba(5, 5, 20, 0.9); padding: 6px 10px; border: 1px solid var(--neon-blue); border-radius: 8px; pointer-events: auto; font-size: 10px; }
        #top-left { top: 65px; left: 15px; }
        #top-right { top: 65px; right: 15px; text-align: right; }

        .app-controls { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #0f0f1e; border-bottom: 2px solid var(--neon-purple); pointer-events: auto; }
        .control-btn { width: 35px; height: 35px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-blue); border-radius: 50%; color: var(--neon-blue); display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* MISSION BOX (SMALL) */
        #mission-box {
            position: absolute; bottom: 40px; left: 15px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--neon-blue);
            padding: 8px 12px; border-radius: 10px; width: 150px; z-index: 20;
            pointer-events: auto;
        }
        #mission-title { font-size: 8px; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 2px; }
        #mission-text { font-size: 10px; font-weight: bold; line-height: 1.2; }

        /* JOYSTICK RIGHT */
        #joystick-zone { position: absolute; bottom: 40px; right: 25px; width: 100px; height: 100px; background: rgba(255,255,255,0.02); border: 1px solid rgba(0, 243, 255, 0.1); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: var(--neon-blue); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.7; }

        /* SHOP */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .shop-content { width: 90%; max-width: 360px; background: #0a0a1a; border: 2px solid var(--neon-purple); padding: 20px; border-radius: 20px; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .shop-item { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 10px; border-radius: 12px; text-align: center; cursor: pointer; }
        .shop-item i { color: var(--neon-blue); font-size: 16px; margin-bottom: 4px; display: block; }
        .shop-item b { font-size: 10px; color: var(--neon-green); }
        .shop-item.locked { opacity: 0.3; pointer-events: none; }

        .btn-start { padding: 10px 30px; font-size: 16px; font-weight: bold; background: none; border: 2px solid var(--neon-green); color: var(--neon-green); border-radius: 20px; cursor: pointer; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="app-controls">
            <button class="control-btn" onclick="toggleShop(true)"><i class="fas fa-shopping-cart"></i></button>
            <div style="color: var(--neon-blue); font-weight: bold; font-size: 13px;">LEVEL <span id="level-val">1</span>: GUARDIAN</div>
            <button class="control-btn" onclick="togglePause()"><i class="fas fa-pause" id="pause-icon"></i></button>
        </div>

        <div id="top-left" class="stat-box">
            <div>SIGNAL</div>
            <div style="width: 80px; height: 5px; background: #111; border-radius: 3px; overflow: hidden; border: 1px solid #333; margin-top:2px;">
                <div id="signal-bar" style="width: 100%; height: 100%; background: var(--neon-green);"></div>
            </div>
        </div>
        
        <div id="top-right" class="stat-box">
            <div>CORE: <span id="lives-val" style="color:var(--neon-red)">3</span></div>
            <div>CR: <span id="score-val" style="color:var(--neon-green)">0</span></div>
        </div>

        <div id="mission-box" class="hidden">
            <div id="mission-title">Задача</div>
            <div id="mission-text">Загрузка...</div>
        </div>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-purple); text-align:center; font-size: 18px; margin:0;">UPGRADES</h2>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyUpgrade('turret', 1200)"><i class="fas fa-crosshairs"></i><b>Турель</b><span>1.2k</span></div>
                <div id="laser-item" class="shop-item locked" onclick="buyUpgrade('laser', 2500)"><i class="fas fa-bolt"></i><b>Лазеры</b><span>2.5k</span></div>
                <div class="shop-item" onclick="buyUpgrade('drone', 3000)"><i class="fas fa-microchip"></i><b>Дроны</b><span>3.0k</span></div>
                <div class="shop-item" onclick="buyUpgrade('magnet', 1000)"><i class="fas fa-magnet"></i><b>Луч Ядра</b><span>1.0k</span></div>
                <div class="shop-item" onclick="buyUpgrade('shield', 800)"><i class="fas fa-shield-alt"></i><b>Щит</b><span>0.8k</span></div>
                <div class="shop-item" onclick="buyUpgrade('fix', 2000)"><i class="fas fa-tools"></i><b>Ремонт</b><span>2.0k</span></div>
            </div>
            <button class="btn-start" style="width:100%; margin-top:10px;" onclick="toggleShop(false)">В БОЙ</button>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="color:var(--neon-blue);">SIGNAL DEFENDER</h1>
        <button class="btn-start" onclick="startGame()">START PROTOCOL</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">DATA PURGED</h1>
        <button class="btn-start" onclick="location.reload()">RELOAD</button>
    </div>

<script>
/** CONFIG */
const WORLD_SIZE = 4000; 
const BASE_POS = { x: 2000, y: 2000 };
const ZOOM = 0.35; 

/** STATE */
let canvas, ctx, started = false, paused = false, score = 0, signalLevel = 100, lives = 3, level = 1, gameId;
let snake = { x: 2050, y: 2050, segments: [], angle: 0, speed: 5, size: 25, length: 15 };
let entities = { food: [], enemies: [], particles: [], turrets: [], bullets: [], drones: [] };
let camera = { x: 0, y: 0 }, input = { x: 0, y: 0 };
let shieldActive = false, coreMagnet = false, laserUpgrade = false;

/** LEVEL & MISSION SYSTEM */
let curMission = 0;
let missionProgress = 0;
const missionPool = [
    { t: "Начни патруль", check: () => input.x !== 0 },
    { t: "Собери данные (голубые)", check: () => missionProgress >= 1 },
    { t: "Убей Глюка (головой)", check: () => missionProgress >= 1 },
    { t: "Копи 1.2к на турель", check: () => score >= 1200 },
    { t: "Купи ТУРЕЛЬ в магазине", check: () => entities.turrets.length > 0 }
];

function updateMission() {
    let m;
    if (curMission < missionPool.length) {
        m = missionPool[curMission];
    } else {
        // Бесконечные миссии уровней
        m = { t: `Цель: Уничтожь ${(curMission-3)*2} врагов`, check: () => missionProgress >= (curMission-3)*2 };
    }
    
    document.getElementById('mission-text').innerText = m.t;
    if(m.check()) {
        curMission++;
        missionProgress = 0;
        if(curMission % 5 === 0) { level++; updateUI(); }
        if(curMission === 4) toggleShop(true);
        updateMission();
    }
}

/** UPGRADES */
function buyUpgrade(type, cost) {
    if (score < cost) return;
    score -= cost;
    if (type === 'turret') {
        const a = Math.random()*6.28;
        entities.turrets.push({ x: BASE_POS.x + Math.cos(a)*150, y: BASE_POS.y + Math.sin(a)*150, last: 0 });
        document.getElementById('laser-item').classList.remove('locked');
    }
    if (type === 'laser') laserUpgrade = true;
    if (type === 'drone') {
        entities.drones.push({ angle: Math.random()*6.28, dist: 250 });
    }
    if (type === 'magnet') coreMagnet = true;
    if (type === 'shield') shieldActive = true;
    if (type === 'fix') lives = Math.min(3, lives + 1);
    updateUI();
}

/** ENGINE */
function init() {
    canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
    resize(); initJoystick(); window.addEventListener('resize', resize);
}
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

function toggleShop(s) { 
    if(!started) return; paused = s;
    document.getElementById('shop-modal').classList.toggle('hidden', !s);
    if(!s) gameId = requestAnimationFrame(gameLoop); else cancelAnimationFrame(gameId);
}

function togglePause() {
    if(!started) return; paused = !paused;
    document.getElementById('pause-icon').className = paused ? "fas fa-play" : "fas fa-pause";
    if(!paused) gameId = requestAnimationFrame(gameLoop); else cancelAnimationFrame(gameId);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('mission-box').classList.remove('hidden');
    started = true;
    for(let i=0; i<15; i++) spawnFood();
    gameId = requestAnimationFrame(gameLoop);
    updateMission();
    setInterval(() => { 
        if(started && !paused && curMission > 1) {
            signalLevel = Math.max(0, signalLevel - (Math.hypot(snake.x-BASE_POS.x, snake.y-BASE_POS.y) < 350 ? 0.3 : 1));
            if(signalLevel <= 0) gameOver();
            updateUI(); 
        }
    }, 1200);
}

function update() {
    if(!started || paused) return;
    updateMission();

    // Snake logic
    if(input.x || input.y) snake.angle = Math.atan2(input.y, input.x);
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;
    
    // Wormholes
    if(snake.x < 0) snake.x = WORLD_SIZE; if(snake.x > WORLD_SIZE) snake.x = 0;
    if(snake.y < 0) snake.y = WORLD_SIZE; if(snake.y > WORLD_SIZE) snake.y = 0;

    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    // Food Magnet Core
    if(coreMagnet) {
        entities.food.forEach(f => {
            const d = Math.hypot(f.x-BASE_POS.x, f.y-BASE_POS.y);
            if(d < 400) {
                const a = Math.atan2(BASE_POS.y-f.y, BASE_POS.x-f.x);
                f.x += Math.cos(a)*4; f.y += Math.sin(a)*4;
            }
        });
    }

    // Drones orbit
    entities.drones.forEach(d => {
        d.angle += 0.03;
        d.x = BASE_POS.x + Math.cos(d.angle) * d.dist;
        d.y = BASE_POS.y + Math.sin(d.angle) * d.dist;
    });

    // Turrets / Lasers
    entities.turrets.forEach(t => {
        let range = laserUpgrade ? 1500 : 800;
        if (Date.now() - t.last > (laserUpgrade ? 400 : 1800)) {
            let target = entities.enemies[0];
            if (target && Math.hypot(t.x-target.x, t.y-target.y) < range) {
                const a = Math.atan2(target.y-t.y, target.x-t.x);
                entities.bullets.push({x: t.x, y: t.y, vx: Math.cos(a)*20, vy: Math.sin(a)*20, laser: laserUpgrade});
                t.last = Date.now();
            }
        }
    });

    entities.bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if(Math.hypot(b.x-BASE_POS.x, b.y-BASE_POS.y) > 2200) entities.bullets.splice(i,1);
    });

    // Spawning (Scale with Level)
    if(curMission >= 2 && Math.random() < (0.006 + level*0.002)) spawnEnemy();

    entities.enemies.forEach((en, i) => {
        const ang = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(ang) * (en.speed + level*0.2); 
        en.y += Math.sin(ang) * (en.speed + level*0.2);

        // Bullet collision
        entities.bullets.forEach((b, bi) => {
            if(Math.hypot(b.x-en.x, b.y-en.y) < 40) {
                entities.enemies.splice(i,1); if(!b.laser) entities.bullets.splice(bi,1);
                score += 50; if(curMission >= 5) missionProgress++;
            }
        });

        // Drone collision
        entities.drones.forEach(dr => {
            if(Math.hypot(dr.x-en.x, dr.y-en.y) < 40) {
                entities.enemies.splice(i,1); score += 30;
            }
        });

        // Core hit
        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 65) {
            if (shieldActive) shieldActive = false; else lives--;
            entities.enemies.splice(i, 1); if(lives <= 0) gameOver(); updateUI();
        }

        // Snake hit (Damage Body)
        snake.segments.forEach((seg, si) => {
            if(si > 2 && Math.hypot(seg.x-en.x, seg.y-en.y) < 20) {
                snake.length = Math.max(5, snake.length - 1); // Уменьшение
                entities.enemies.splice(i,1);
            }
        });

        // Snake Head kill
        if(Math.hypot(en.x - snake.x, en.y - snake.y) < 45) {
            score += 100; entities.enemies.splice(i, 1);
            if(curMission === 2 || curMission >= 5) missionProgress++;
            updateUI();
        }
    });

    entities.food.forEach((f, i) => {
        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 60) {
            signalLevel = Math.min(100, signalLevel + 20);
            snake.length += 3; score += 25;
            entities.food.splice(i, 1); spawnFood();
            if(curMission === 1 || curMission >= 5) missionProgress++;
            updateUI();
        }
    });
}

function draw() {
    ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(-camera.x, -camera.y);

    // Grid
    ctx.strokeStyle = '#112'; ctx.lineWidth = 5;
    for(let i=0; i<=WORLD_SIZE; i+=1000) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    // Core Magnet Visual
    if(coreMagnet) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
        ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 400, 0, 6.28); ctx.stroke();
    }

    // Base Core
    ctx.shadowBlur = 40; ctx.shadowColor = 'cyan';
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 60, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'cyan'; ctx.lineWidth = 5; ctx.stroke();
    ctx.shadowBlur = 0; 
    if(shieldActive) { ctx.strokeStyle = 'cyan'; ctx.lineWidth = 15; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 110, 0, 6.28); ctx.stroke(); }

    // Drones
    entities.drones.forEach(dr => {
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(dr.x, dr.y, 15, 0, 6.28); ctx.fill();
        ctx.strokeStyle = 'cyan'; ctx.stroke();
    });

    // Radar Arrows
    entities.enemies.forEach(en => {
        const a = Math.atan2(en.y - BASE_POS.y, en.x - BASE_POS.x);
        ctx.save(); ctx.translate(BASE_POS.x, BASE_POS.y); ctx.rotate(a);
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.moveTo(160, -12); ctx.lineTo(190, 0); ctx.lineTo(160, 12); ctx.fill(); ctx.restore();
    });

    // Turrets & Weapons
    entities.turrets.forEach(t => {
        ctx.fillStyle = laserUpgrade ? var(--neon-purple) : '#fff';
        ctx.fillRect(t.x-25, t.y-25, 50, 50);
        if(laserUpgrade) ctx.strokeRect(t.x-30, t.y-30, 60, 60);
    });

    entities.bullets.forEach(b => {
        ctx.fillStyle = b.laser ? var(--neon-purple) : 'yellow';
        if(b.laser) {
            ctx.fillRect(b.x-5, b.y-5, 30, 10);
        } else {
            ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 6.28); ctx.fill();
        }
    });

    // Food & Enemies
    ctx.fillStyle = 'cyan'; entities.food.forEach(f => { ctx.beginPath(); ctx.arc(f.x, f.y, 20, 0, 6.28); ctx.fill(); });
    ctx.fillStyle = '#ff0055'; entities.enemies.forEach(en => { ctx.fillRect(en.x-35, en.y-35, 70, 70); });

    // Snake
    ctx.fillStyle = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const r = (snake.size * (1 - i / snake.segments.length)) + 5;
        ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, 6.28); ctx.fill();
    });

    // Compass
    const bA = Math.atan2(BASE_POS.y - snake.y, BASE_POS.x - snake.x);
    ctx.save(); ctx.translate(snake.x, snake.y); ctx.rotate(bA);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.6)'; ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(50, -15); ctx.lineTo(50, 15); ctx.fill(); ctx.restore();

    ctx.restore();
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0) {x=Math.random()*WORLD_SIZE; y=-200;}
    else if(side===1) {x=WORLD_SIZE+200; y=Math.random()*WORLD_SIZE;}
    else if(side===2) {x=Math.random()*WORLD_SIZE; y=WORLD_SIZE+200;}
    else {x=-200; y=Math.random()*WORLD_SIZE;}
    entities.enemies.push({ x, y, speed: 1.5 + Math.random() });
}
function spawnFood() { entities.food.push({ x: 500 + Math.random()*(WORLD_SIZE-1000), y: 500 + Math.random()*(WORLD_SIZE-1000) }); }

function updateUI() {
    document.getElementById('signal-bar').style.width = signalLevel + '%';
    document.getElementById('lives-val').innerText = lives;
    document.getElementById('score-val').innerText = score;
    document.getElementById('level-val').innerText = level;
}
function gameOver() { started = false; document.getElementById('game-over-screen').classList.remove('hidden'); }
function gameLoop() { if(!started || paused) return; update(); draw(); gameId = requestAnimationFrame(gameLoop); }

function initJoystick() {
    const zone = document.getElementById('joystick-zone'), stick = document.getElementById('joystick-stick');
    let active = false;
    const handle = (e) => {
        if(!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width/2, centerY = rect.top + rect.height/2;
        let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
        const dist = Math.min(rect.width/2, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
        stick.style.left = `calc(50% + ${Math.cos(ang)*dist}px)`; stick.style.top = `calc(50% + ${Math.sin(ang)*dist}px)`;
        input.x = Math.cos(ang); input.y = Math.sin(ang);
    };
    zone.addEventListener('touchstart', (e) => { active = true; handle(e); });
    window.addEventListener('touchmove', handle, {passive:false});
    window.addEventListener('touchend', () => { active = false; stick.style.left='50%'; stick.style.top='50%'; input.x=0; input.y=0; });
}

window.setGamePause = function(state) {
    if(started) { paused = state; if(!paused) gameId = requestAnimationFrame(gameLoop); else cancelAnimationFrame(gameId); }
};
init();
</script>
</body>
</html>
