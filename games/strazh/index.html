<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Страж Эфира 13.2 - Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --neon-green: #39ff14; --neon-blue: #00f3ff; --neon-red: #ff0055; 
            --neon-purple: #bc13fe; --neon-gold: #ffcf00; --bg-dark: #05050f;
        }
        body { 
            margin: 0; padding: 0; background: var(--bg-dark); color: #fff; 
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; 
        }
        canvas { display: block; }

        /* ИНТЕРФЕЙСНЫЕ СЛОИ */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .app-controls { 
            position: absolute; top: 0; left: 0; right: 0; height: 55px; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px; background: #0f0f1e; border-bottom: 2px solid var(--neon-purple); 
            pointer-events: auto; 
        }
        .control-btn { 
            width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--neon-blue); border-radius: 50%; 
            color: var(--neon-blue); display: flex; align-items: center; 
            justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .control-btn:active { transform: scale(0.9); background: var(--neon-blue); color: #000; }

        /* БЛОКИ СТАТИСТИКИ */
        .stat-box { 
            position: absolute; background: rgba(5, 5, 20, 0.9); 
            padding: 8px 12px; border: 1px solid var(--neon-blue); 
            border-radius: 10px; pointer-events: auto; font-size: 11px; 
        }
        #top-left { top: 70px; left: 15px; }
        #top-right { top: 70px; right: 15px; text-align: right; }

        .progress-container { 
            width: 100px; height: 6px; background: #111; border-radius: 3px; 
            overflow: hidden; border: 1px solid #333; margin-top: 4px;
        }
        #signal-bar { width: 100%; height: 100%; background: var(--neon-green); transition: width 0.3s; }

        /* МИССИИ (СЛЕВА ВНИЗУ) */
        #mission-box {
            position: absolute; bottom: 35px; left: 20px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--neon-blue);
            padding: 10px 15px; border-radius: 15px; width: 160px; z-index: 20;
            pointer-events: auto; border-left: 4px solid var(--neon-purple);
        }
        #mission-title { font-size: 9px; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 2px; }
        #mission-text { font-size: 11px; font-weight: bold; color: #fff; line-height: 1.2; }

        /* ДЖОЙСТИК (СПРАВА ВНИЗУ) */
        #joystick-zone { 
            position: absolute; bottom: 40px; right: 30px; width: 100px; height: 100px; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 243, 255, 0.2); 
            border-radius: 50%; pointer-events: auto; 
        }
        #joystick-stick { 
            position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; 
            background: var(--neon-blue); border-radius: 50%; transform: translate(-50%, -50%); 
        }

        /* МАГАЗИН И МОДАЛКИ */
        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000; display: flex; 
            align-items: center; justify-content: center; pointer-events: auto; 
        }
        .shop-content { 
            width: 92%; max-width: 380px; background: #0a0a1a; 
            border: 2px solid var(--neon-purple); padding: 20px; border-radius: 20px; 
        }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .shop-item { 
            background: rgba(255,255,255,0.05); border: 1px solid #333; 
            padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; 
        }
        .shop-item.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        .shop-item i { color: var(--neon-blue); font-size: 20px; margin-bottom: 5px; display: block; }
        .shop-item b { font-size: 11px; color: var(--neon-green); }
        .shop-item span { display: block; font-size: 9px; color: #888; }

        /* СТАРТОВЫЙ ЭКРАН */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 100; pointer-events: auto; 
        }
        .btn-start { 
            padding: 15px 45px; font-size: 18px; font-weight: bold; background: none; 
            border: 2px solid var(--neon-green); color: var(--neon-green); 
            border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px var(--neon-green);
            pointer-events: auto; z-index: 110;
        }
        .btn-start:active { background: var(--neon-green); color: #000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="app-controls">
            <button class="control-btn" onclick="toggleShop(true)"><i class="fas fa-shopping-cart"></i></button>
            <div style="color: var(--neon-blue); font-weight: bold; font-size: 14px; letter-spacing: 2px;">СТРАЖ ЭФИРА</div>
            <button class="control-btn" onclick="togglePause()"><i class="fas fa-pause" id="pause-icon"></i></button>
        </div>

        <div id="top-left" class="stat-box">
            <div>СИГНАЛ</div>
            <div class="progress-container"><div id="signal-bar"></div></div>
        </div>
        
        <div id="top-right" class="stat-box">
            <div>ЯДРО: <span id="lives-val" style="color:var(--neon-red)">3</span></div>
            <div>ДАННЫЕ: <span id="score-val" style="color:var(--neon-green)">0</span></div>
        </div>

        <div id="mission-box" class="hidden">
            <div id="mission-title">Задача <span id="m-id">1</span></div>
            <div id="mission-text">Загрузка протоколов...</div>
        </div>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-purple); text-align:center; font-size: 20px; margin:0;">МОДЕРНИЗАЦИЯ</h2>
            <div class="shop-grid">
                <div class="shop-item" id="item-turret" onclick="buyUpgrade('turret', 1200)">
                    <i class="fas fa-crosshairs"></i><b>Турель</b><span>1.2k CR</span>
                </div>
                <div class="shop-item" id="item-laser" onclick="buyUpgrade('laser', 3000)">
                    <i class="fas fa-bolt"></i><b>Лазер</b><span>3.0k CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('drone', 2000)">
                    <i class="fas fa-robot"></i><b>Дрон</b><span>2.0k CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('fix', 2500)">
                    <i class="fas fa-tools"></i><b>Ремонт</b><span>2.5k CR</span>
                </div>
            </div>
            <div style="padding:12px; background:rgba(255,255,255,0.03); border-radius:12px; font-size:10px; color:#aaa; border:1px solid #222;">
                <b>ИНФО:</b> Лазеры бьют дальше турелей. Дроны охраняют Ядро. Длина хвоста — твое здоровье. Копирование кода запрещено. (c) LepotaFM 2025.
            </div>
            <button class="btn-start" style="width:100%; margin-top:15px; font-size: 14px;" onclick="toggleShop(false)">В БОЙ</button>
        </div>
    </div>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen" class="overlay">
        <h1 style="color:var(--neon-blue); letter-spacing:5px; text-shadow: 0 0 20px var(--neon-blue); margin-bottom: 25px;">СТРАЖ ЭФИРА</h1>
        <button class="btn-start" id="actual-start-btn" onclick="startGame()">ЗАПУСК СИСТЕМЫ</button>
    </div>

    <!-- КОНЕЦ ИГРЫ -->
    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">СВЯЗЬ ПОТЕРЯНА</h1>
        <div id="final-stats" style="margin-bottom:20px; color:#888;"></div>
        <button class="btn-start" onclick="location.reload()">ПЕРЕЗАГРУЗКА</button>
    </div>

<script>
/** --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ --- */
const WORLD_SIZE = 4000;
const BASE_POS = { x: 2000, y: 2000 };
const ZOOM = 0.35;

let canvas, ctx, gameId;
let started = false, paused = false, score = 0, signalLevel = 100, lives = 3;
let snake = { x: 2050, y: 2050, segments: [], angle: 0, speed: 5.5, size: 25, length: 20 };
let entities = { food: [], enemies: [], particles: [], turrets: [], bullets: [], drones: [] };
let camera = { x: 0, y: 0 }, input = { x: 0, y: 0 };
let curMission = 0, missionProgress = 0, frameCount = 0, shieldActive = false;

// Прямая привязка для предотвращения ошибок области видимости
window.startGame = startGame;
window.toggleShop = toggleShop;
window.togglePause = togglePause;
window.buyUpgrade = buyUpgrade;
    /** --- ИНИЦИАЛИЗАЦИЯ ДВИЖКА --- */
window.onload = function() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resize();
    initJoystick();
    window.addEventListener('resize', resize);
    console.log("Система готова к запуску");
};

/** --- ЗАПУСК ИГРЫ (ФИКС КНОПКИ) --- */
function startGame() {
    if (started) return;
    
    // Скрываем стартовый экран и показываем миссии
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('mission-box').classList.remove('hidden');
    
    started = true;
    paused = false;
    
    // Подготовка змейки
    snake.segments = [];
    for(let i=0; i < snake.length; i++) {
        snake.segments.push({x: snake.x, y: snake.y});
    }
    
    // Спавн первых ресурсов
    for(let i=0; i<15; i++) spawnFood();
    
    // Запуск анимационного цикла
    gameId = requestAnimationFrame(gameLoop);
    updateMission();

    // Логика падения сигнала (1.5 сек интервал)
    setInterval(() => { 
        if(started && !paused && curMission > 1) {
            let dist = Math.hypot(snake.x - BASE_POS.x, snake.y - BASE_POS.y);
            // Если игрок рядом с базой (400px), сигнал падает в 3 раза медленнее
            let decay = dist < 400 ? 0.3 : 1;
            signalLevel = Math.max(0, signalLevel - decay); 
            if(signalLevel <= 0) gameOver();
            updateUI(); 
        }
    }, 1500);
}

/** --- СИСТЕМА МИССИЙ (100+ УРОВНЕЙ) --- */
const baseMissions = [
    { t: "Протокол 1: Начни патруль (двигай стик)", check: () => input.x !== 0 || input.y !== 0 },
    { t: "Протокол 2: Собери голубой БАЙТ данных", check: () => missionProgress >= 1 },
    { t: "Протокол 3: Убей 2 помехи ударом ГОЛОВЫ", check: () => missionProgress >= 2 },
    { t: "Протокол 4: Накопи 1200 CR для защиты", check: () => score >= 1200 },
    { t: "Протокол 5: Купи ТУРЕЛЬ в магазине", check: () => entities.turrets.length > 0 }
];

function getMission(id) {
    if (id < baseMissions.length) return baseMissions[id];
    // Автогенерация бесконечных миссий
    const types = [
        { t: "Уничтожь {n} Глюков", n: 5 + (id * 2), check: () => missionProgress >= 5 + (id * 2) },
        { t: "Собери {n} байтов сигнала", n: 10 + id, check: () => missionProgress >= 10 + id },
        { t: "Заработай {n} CR за вылет", n: id * 900, check: () => score >= id * 900 },
        { t: "Улучши оборону: купи любой модуль", check: () => missionProgress >= 1 }
    ];
    return types[id % types.length];
}

function updateMission() {
    const m = getMission(curMission);
    document.getElementById('m-id').innerText = curMission + 1;
    document.getElementById('mission-text').innerText = m.t.replace("{n}", m.n || "");
    
    if (m.check()) {
        curMission++;
        missionProgress = 0;
        // Авто-пауза для обучения покупкам
        if(curMission === 4 && !paused) toggleShop(true); 
        updateMission();
    }
}

/** --- МАГАЗИН И МОДЕРНИЗАЦИЯ --- */
function buyUpgrade(type, cost) {
    if (score < cost) return;
    
    if (type === 'turret') {
        score -= cost;
        const ang = Math.random() * 6.28;
        entities.turrets.push({ 
            x: BASE_POS.x + Math.cos(ang)*160, 
            y: BASE_POS.y + Math.sin(ang)*160, 
            type: 'bolt', lastShot: 0 
        });
    } else if (type === 'laser') {
        // Улучшение существующей болт-турели до лазера
        let t = entities.turrets.find(t => t.type === 'bolt');
        if (t) {
            score -= cost;
            t.type = 'laser';
            missionProgress++; // Для миссий на покупку
        } else {
            alert("Сначала нужна обычная турель!");
        }
    } else if (type === 'drone') {
        score -= cost;
        // Добавляем дрона на орбиту
        entities.drones.push({ angle: Math.random()*6.28, dist: 130 + Math.random()*50 });
        missionProgress++;
    } else if (type === 'fix') {
        if (lives < 3) { 
            score -= cost; 
            lives++; 
        }
    }
    updateUI();
}

/** --- ОСНОВНОЙ ЦИКЛ ОБНОВЛЕНИЯ --- */
function update() {
    if(!started || paused) return;
    frameCount++;
    updateMission();

    // 1. Движение змеи
    if(input.x || input.y) snake.angle = Math.atan2(input.y, input.x);
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;

    // 2. Червоточины (Мир зациклен)
    if(snake.x < 0) snake.x = WORLD_SIZE; if(snake.x > WORLD_SIZE) snake.x = 0;
    if(snake.y < 0) snake.y = WORLD_SIZE; if(snake.y > WORLD_SIZE) snake.y = 0;

    // Обновление сегментов хвоста
    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    // 3. Камера
    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    // 4. Отработка турелей (Болты и Лазеры)
    entities.turrets.forEach(t => {
        if (t.type === 'bolt') {
            if (Date.now() - t.lastShot > 1700 && entities.bullets.length < 15) {
                let target = entities.enemies[0];
                if (target && Math.hypot(t.x - target.x, t.y - target.y) < 1000) {
                    const a = Math.atan2(target.y - t.y, target.x - t.x);
                    entities.bullets.push({x: t.x, y: t.y, vx: Math.cos(a)*15, vy: Math.sin(a)*15});
                    t.lastShot = Date.now();
                }
            }
        } else if (t.type === 'laser') {
            // Лазер: мгновенный удар на 1500px каждые 2.5 сек
            if (Date.now() - t.lastShot > 2500) {
                let target = entities.enemies[0];
                if (target && Math.hypot(t.x - target.x, t.y - target.y) < 1500) {
                    t.activeLaser = { x: target.x, y: target.y, time: Date.now() + 150 };
                    entities.enemies.shift(); // Мгновенный аннигилятор
                    score += 70;
                    t.lastShot = Date.now();
                }
            }
        }
    });

    // 5. Дроны-защитники (Feature 14)
    entities.drones.forEach(d => {
        d.angle += 0.04; // Скорость вращения
        const dx = BASE_POS.x + Math.cos(d.angle) * d.dist;
        const dy = BASE_POS.y + Math.sin(d.angle) * d.dist;
        d.x = dx; d.y = dy;

        // Дрон уничтожает врагов при контакте
        entities.enemies.forEach((en, ei) => {
            if(Math.hypot(en.x - dx, en.y - dy) < 50) {
                entities.enemies.splice(ei, 1);
                createParticles(en.x, en.y, 'purple', 8);
                score += 35;
            }
        });
    });
    // 6. Логика полета снарядов
    entities.bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        // Удаление пуль за пределами активной зоны
        if(Math.hypot(b.x - BASE_POS.x, b.y - BASE_POS.y) > 2500) entities.bullets.splice(i,1);
    });

    // 7. Враги (Глюки) - Спавн только со 2-й миссии
    if(curMission >= 2 && Math.random() < (0.007 + (curMission * 0.0003))) spawnEnemy();

    entities.enemies.forEach((en, i) => {
        const ang = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(ang) * en.speed;
        en.y += Math.sin(ang) * en.speed;

        // Попадание пули
        entities.bullets.forEach((b, bi) => {
            if(Math.hypot(b.x - en.x, b.y - en.y) < 45) {
                entities.enemies.splice(i,1); 
                entities.bullets.splice(bi,1);
                score += 50; 
                if(curMission >= 5) missionProgress++;
                createParticles(en.x, en.y, 'blue', 5);
            }
        });

        // Атака Ядра
        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 70) {
            if (shieldActive) {
                shieldActive = false; // Щит поглощает урон
                createParticles(BASE_POS.x, BASE_POS.y, 'cyan', 25);
            } else {
                lives--;
            }
            entities.enemies.splice(i, 1);
            if(lives <= 0) gameOver();
            updateUI();
        }

        // Атака Змеи (Столкновение головой)
        if(Math.hypot(en.x - snake.x, en.y - snake.y) < 55) {
            score += 100;
            // Урон: змейка теряет 8 сегментов длины
            snake.length = Math.max(10, snake.length - 8); 
            entities.enemies.splice(i, 1);
            createParticles(en.x, en.y, 'red', 10);
            if(curMission === 2) missionProgress++; // Для миссии "Убей головой"
            if(curMission >= 5) missionProgress++;
            updateUI();
        }
    });

    // 8. Ресурсы и Притягивающий луч (Feature 18)
    entities.food.forEach((f, i) => {
        const distToCore = Math.hypot(f.x - BASE_POS.x, f.y - BASE_POS.y);
        const distToSnake = Math.hypot(f.x - snake.x, f.y - snake.y);

        // Feature 18: Ядро затягивает еду в радиусе 350px
        if (distToCore < 350) {
            const a = Math.atan2(BASE_POS.y - f.y, BASE_POS.x - f.x);
            f.x += Math.cos(a) * 4;
            f.y += Math.sin(a) * 4;
        }

        // Сбор змейкой
        if(distToSnake < 60) {
            signalLevel = Math.min(100, signalLevel + 20);
            snake.length += 4; // Рост змеи
            score += 30;
            entities.food.splice(i, 1);
            spawnFood();
            if(curMission === 1) missionProgress++; // Для миссии "Собери байт"
            if(curMission >= 5) missionProgress++;
            updateUI();
        }
        
        // Автоматическая зарядка Ядра при попадании байта в центр
        if (distToCore < 55) {
            signalLevel = Math.min(100, signalLevel + 5);
            entities.food.splice(i, 1);
            spawnFood();
            updateUI();
        }
    });

    // 9. Жизненный цикл частиц
    entities.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.03;
        if(p.life <= 0) entities.particles.splice(i, 1);
    });

    if(audioCtx) {
        let nv = signalLevel > 50 ? 0 : (50 - signalLevel) / 50;
        // Здесь можно добавить управление шумом, если AudioContext инициализирован
    }
}

/** --- ГРАФИЧЕСКИЙ ДВИЖОК --- */
function gameLoop() {
    if(!started || paused) return;
    update();
    draw();
    gameId = requestAnimationFrame(gameLoop);
}

function draw() {
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-camera.x, -camera.y);

    // Сетка
    ctx.strokeStyle = '#112'; ctx.lineWidth = 10;
    for(let i=0; i<=WORLD_SIZE; i+=1000) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    // 1. Отрисовка Ядра и Силового поля
    if(shieldActive) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)'; ctx.lineWidth = 15;
        ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 115, 0, 6.28); ctx.stroke();
    }
    ctx.shadowBlur = 40; ctx.shadowColor = '#00f3ff';
    ctx.fillStyle = '#0a0a1a'; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 65, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 6; ctx.stroke();
    ctx.shadowBlur = 0;

    // Эффект гравитации Ядра
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 350 + Math.sin(frameCount*0.1)*15, 0, 6.28); ctx.stroke();

    // 2. Радар угроз (стрелки вокруг ядра)
    entities.enemies.forEach(en => {
        const ang = Math.atan2(en.y - BASE_POS.y, en.x - BASE_POS.x);
        ctx.save(); ctx.translate(BASE_POS.x, BASE_POS.y); ctx.rotate(ang);
        ctx.fillStyle = '#ff0055'; ctx.beginPath();
        ctx.moveTo(175, -12); ctx.lineTo(205, 0); ctx.lineTo(175, 12); ctx.fill();
        ctx.restore();
    });

    // 3. Отрисовка Турелей и ЛАЗЕРОВ (Feature 2)
    entities.turrets.forEach(t => {
        ctx.fillStyle = '#fff';
        ctx.fillRect(t.x - 25, t.y - 25, 50, 50);
        ctx.strokeStyle = t.type === 'laser' ? '#bc13fe' : '#00f3ff';
        ctx.lineWidth = 4; ctx.strokeRect(t.x - 25, t.y - 25, 50, 50);

        if (t.type === 'laser' && t.activeLaser && t.activeLaser.time > Date.now()) {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.activeLaser.x, t.activeLaser.y); ctx.stroke();
            ctx.strokeStyle = '#bc13fe'; ctx.lineWidth = 5; ctx.stroke();
        }
    });

    // 4. Дроны-защитники (Feature 14)
    entities.drones.forEach(d => {
        ctx.fillStyle = '#bc13fe'; ctx.shadowBlur = 15; ctx.shadowColor = '#bc13fe';
        ctx.beginPath(); ctx.arc(d.x, d.y, 15, 0, 6.28); ctx.fill();
        ctx.shadowBlur = 0;
    });

    // 5. Еда, Пули и Враги
    ctx.fillStyle = 'yellow'; entities.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 6.28); ctx.fill(); });
    ctx.fillStyle = '#00f3ff'; entities.food.forEach(f => { ctx.beginPath(); ctx.arc(f.x, f.y, 22, 0, 6.28); ctx.fill(); });
    
    entities.enemies.forEach(en => {
        ctx.fillStyle = '#ff0055'; 
        if(en.speed > 2.5) { // Треугольники (быстрые)
            ctx.beginPath(); ctx.moveTo(en.x, en.y-40); ctx.lineTo(en.x+30, en.y+20); ctx.lineTo(en.x-30, en.y+20); ctx.fill();
        } else { // Квадраты (обычные)
            ctx.fillRect(en.x-35, en.y-35, 70, 70); 
        }
    });

    // 6. Змейка (Чистый неоновый луч)
    ctx.fillStyle = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const r = (snake.size * (1 - i / snake.segments.length)) + 5;
        ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, 6.28); ctx.fill();
    });

    // 7. Компас навигации на голове змеи
    const baseAng = Math.atan2(BASE_POS.y - snake.y, BASE_POS.x - snake.x);
    ctx.save(); ctx.translate(snake.x, snake.y); ctx.rotate(baseAng);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.7)';
    ctx.beginPath(); ctx.moveTo(80, 0); ctx.lineTo(55, -15); ctx.lineTo(55, 15); ctx.fill();
    ctx.restore();

    // 8. Частицы
    entities.particles.forEach(p => {
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 12, 12);
    });

    ctx.globalAlpha = 1.0;
    ctx.restore();
}

/** --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ --- */
function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0) {x=Math.random()*WORLD_SIZE; y=-250;}
    else if(side===1) {x=WORLD_SIZE+250; y=Math.random()*WORLD_SIZE;}
    else if(side===2) {x=Math.random()*WORLD_SIZE; y=WORLD_SIZE+250;}
    else {x=-250; y=Math.random()*WORLD_SIZE;}
    const isFast = Math.random() > 0.8;
    entities.enemies.push({ x, y, speed: isFast ? 3.0 : 1.6 });
}

function spawnFood() {
    entities.food.push({ 
        x: 500 + Math.random()*(WORLD_SIZE-1000), 
        y: 500 + Math.random()*(WORLD_SIZE-1000) 
    });
}

function createParticles(x, y, color, count) {
    if (entities.particles.length > 50) return;
    for(let i=0; i<count; i++) {
        entities.particles.push({
            x, y, color,
            vx: (Math.random()-0.5)*25,
            vy: (Math.random()-0.5)*25,
            life: 1.0
        });
    }
}

function gameOver() {
    started = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-stats').innerText = "Данных собрано: " + score;
}

window.setGamePause = function(state) {
    if(started) {
        paused = state;
        if(!paused) gameId = requestAnimationFrame(gameLoop);
        else cancelAnimationFrame(gameId);
    }
};

// Финальный инициализатор
init();
</script>
