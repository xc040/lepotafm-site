<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signal Defender - Master 7.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon-green: #39ff14; --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-purple: #bc13fe; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* ИНТЕРФЕЙС */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stat-box { position: absolute; background: rgba(5, 5, 20, 0.9); padding: 8px 12px; border: 1px solid var(--neon-blue); border-radius: 10px; pointer-events: auto; font-size: 12px; }
        #top-left { top: 65px; left: 15px; }
        #top-right { top: 65px; right: 15px; text-align: right; }

        .app-controls { position: absolute; top: 0; left: 0; right: 0; height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #0f0f1e; border-bottom: 2px solid var(--neon-purple); pointer-events: auto; }
        .control-btn { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-blue); border-radius: 50%; color: var(--neon-blue); display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* МЕНЮ ПАУЗЫ И МАГАЗИН */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .shop-content { width: 90%; max-width: 400px; height: 80vh; background: #0a0a1a; border: 1px solid var(--neon-purple); padding: 20px; border-radius: 20px; overflow-y: auto; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .shop-item { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; }
        .shop-item:active { background: var(--neon-purple); }
        .shop-item i { font-size: 20px; color: var(--neon-blue); display: block; margin-bottom: 5px; }
        .shop-item span { display: block; font-size: 10px; color: #aaa; }
        .shop-item b { font-size: 12px; color: var(--neon-green); }

        .btn-start { padding: 12px 30px; font-size: 18px; font-weight: bold; background: none; border: 2px solid var(--neon-green); color: var(--neon-green); border-radius: 25px; cursor: pointer; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }

        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 80px; height: 80px; background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 243, 255, 0.1); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; background: var(--neon-blue); border-radius: 50%; transform: translate(-50%, -50%); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="app-controls">
            <button class="control-btn" onclick="toggleShop(true)"><i class="fas fa-shopping-cart"></i></button>
            <div style="color: var(--neon-blue); font-weight: bold; letter-spacing: 1px; font-size: 13px;">SIGNAL DEFENDER 7.0</div>
            <button class="control-btn" onclick="togglePause()"><i class="fas fa-pause" id="pause-icon"></i></button>
        </div>

        <div id="top-left" class="stat-box">
            <div style="font-size: 9px;">СИГНАЛ</div>
            <div style="width: 80px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; border: 1px solid #333;">
                <div id="signal-bar" style="width: 100%; height: 100%; background: var(--neon-green); transition: width 0.3s;"></div>
            </div>
        </div>
        <div id="top-right" class="stat-box">
            <div style="font-size: 10px;">CORE: <span id="lives-val" style="color:var(--neon-red)">3</span> | DATA: <span id="score-val">0</span></div>
        </div>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>

    <!-- ТАКТИЧЕСКОЕ МЕНЮ / МАГАЗИН -->
    <div id="shop-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-purple); text-align:center; font-size: 18px; margin-top:0;">МОДЕРНИЗАЦИЯ</h2>
            <div style="text-align:center; font-size:12px; color:var(--neon-green); margin-bottom:10px;">Доступно Данных: <span id="shop-credits">0</span></div>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyUpgrade('turret', 1000)">
                    <i class="fas fa-crosshairs"></i><b>Турель</b><span>1000 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('shield', 500)">
                    <i class="fas fa-shield-alt"></i><b>Щит Ядра</b><span>500 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('magnet', 300)">
                    <i class="fas fa-magnet"></i><b>Магнит</b><span>300 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('emp', 800)">
                    <i class="fas fa-bolt"></i><b>ЭМИ Удар</b><span>800 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('fix', 1500)">
                    <i class="fas fa-tools"></i><b>Ремонт</b><span>1500 CR</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('speed', 400)">
                    <i class="fas fa-wind"></i><b>Рывок</b><span>400 CR</span>
                </div>
            </div>
            <button class="btn-start" style="width:100%; margin-top:20px; font-size:14px;" onclick="toggleShop(false)">ВЕРНУТЬСЯ В БОЙ</button>
            <div style="font-size:8px; color:#444; margin-top:15px; text-align:center;">LICENSED TO LEPOTAFM. COPYING PROHIBITED.</div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="color:var(--neon-blue); font-size: 24px;">SIGNAL DEFENDER</h1>
        <button class="btn-start" onclick="startGame()">ИНИЦИАЛИЗАЦИЯ</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">SIGNAL LOST</h1>
        <button class="btn-start" onclick="location.reload()">REBOOT</button>
    </div>

<script>
/** CONFIG */
const STREAM_URL = "https://lepotafm.ru/listen/lepotafm/radio.mp3";
const WORLD_SIZE = 3000; // УВЕЛИЧЕННЫЙ МИР
const BASE_POS = { x: 1500, y: 1500 };
const ZOOM = 0.45; // ЕЩЕ БОЛЬШЕ ОТДАЛЕНИЕ ДЛЯ СВОБОДЫ

/** STATE */
let canvas, ctx, started = false, paused = false, score = 0, signalLevel = 100, lives = 3;
let snake = { x: 1550, y: 1550, segments: [], angle: 0, speed: 3.5, size: 20, length: 15 };
let entities = { food: [], enemies: [], powerups: [], particles: [], turrets: [], bullets: [] };
let camera = { x: 0, y: 0 }, input = { x: 0, y: 0 };
let audioCtx, noiseGain, magnetTimer = 0, speedTimer = 0, shieldActive = false;

function init() {
    canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
    resize(); initJoystick(); window.addEventListener('resize', resize);
    setInterval(sendPing, 60000);
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

function toggleShop(s) { 
    if(!started) return;
    paused = s;
    document.getElementById('shop-modal').classList.toggle('hidden', !s);
    document.getElementById('shop-credits').innerText = score;
}

/** UPGRADES LOGIC */
function buyUpgrade(type, cost) {
    if (score < cost) return alert("Недостаточно данных!");
    score -= cost;
    if (type === 'turret') {
        const angle = Math.random() * Math.PI * 2;
        entities.turrets.push({ x: BASE_POS.x + Math.cos(angle)*100, y: BASE_POS.y + Math.sin(angle)*100, lastShot: 0 });
    }
    if (type === 'shield') shieldActive = true;
    if (type === 'magnet') magnetTimer = Date.now() + 15000;
    if (type === 'emp') { entities.enemies = []; entities.particles.push({x:BASE_POS.x, y:BASE_POS.y, color:'white', vx:0, vy:0, life:2}); }
    if (type === 'fix') lives = Math.min(3, lives + 1);
    if (type === 'speed') { snake.speed = 6; setTimeout(() => snake.speed = 3.5, 5000); }
    updateUI();
}

/** AUDIO */
function initAudio() {
    const isInsideApp = window.self !== window.top;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (!isInsideApp) {
        const m = new Audio(STREAM_URL); m.crossOrigin="anonymous";
        const s = audioCtx.createMediaElementSource(m);
        const g = audioCtx.createGain(); s.connect(g).connect(audioCtx.destination); m.play();
    }
    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
    const o = nb.getChannelData(0); for(let i=0; i<o.length; i++) o[i]=Math.random()*2-1;
    const ns = audioCtx.createBufferSource(); ns.buffer=nb; ns.loop=true;
    noiseGain = audioCtx.createGain(); noiseGain.gain.value=0;
    ns.connect(noiseGain).connect(audioCtx.destination); ns.start();
}

/** GAME LOGIC */
function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    initAudio(); started = true;
    for(let i=0; i<15; i++) spawnFood();
    requestAnimationFrame(gameLoop);
    setInterval(() => { if(started && !paused) signalLevel = Math.max(0, signalLevel-1); updateUI(); }, 1200);
}

function update() {
    if(input.x || input.y) snake.angle = Math.atan2(input.y, input.x);
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;
    snake.x = Math.max(0, Math.min(WORLD_SIZE, snake.x));
    snake.y = Math.max(0, Math.min(WORLD_SIZE, snake.y));
    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    // Turrets Shooting
    entities.turrets.forEach(t => {
        if (Date.now() - t.lastShot > 800) {
            let target = entities.enemies[0];
            if (target) {
                const ang = Math.atan2(target.y - t.y, target.x - t.x);
                entities.bullets.push({x: t.x, y: t.y, vx: Math.cos(ang)*8, vy: Math.sin(ang)*8});
                t.lastShot = Date.now();
            }
        }
    });

    entities.bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (b.x<0 || b.x>WORLD_SIZE || b.y<0 || b.y>WORLD_SIZE) entities.bullets.splice(i,1);
    });

    if(Math.random() < 0.02) spawnEnemy();
    entities.enemies.forEach((en, i) => {
        const ang = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(ang) * en.speed; en.y += Math.sin(ang) * en.speed;

        // Bullet hit
        entities.bullets.forEach((b, bi) => {
            if(Math.hypot(b.x-en.x, b.y-en.y) < 20) {
                entities.enemies.splice(i,1); entities.bullets.splice(bi,1);
                score += 50; createParticles(en.x, en.y, 'blue');
            }
        });

        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 50) {
            if (shieldActive) { shieldActive = false; } else { lives--; }
            createParticles(en.x, en.y, 'red'); entities.enemies.splice(i, 1);
            if(lives <= 0) gameOver(); updateUI();
        }

        if(Math.hypot(en.x - snake.x, en.y - snake.y) < 30) {
            score += 100; createParticles(en.x, en.y, 'green'); entities.enemies.splice(i, 1);
            updateUI();
        }
    });

    entities.food.forEach((f, i) => {
        const dist = Math.hypot(f.x - snake.x, f.y - snake.y);
        if (magnetTimer > Date.now() && dist < 400) {
            const ang = Math.atan2(snake.y - f.y, snake.x - f.x);
            f.x += Math.cos(ang)*5; f.y += Math.sin(ang)*5;
        }
        if(dist < 30) {
            signalLevel = Math.min(100, signalLevel + 15);
            snake.length += 5; score += 20;
            entities.food.splice(i, 1); spawnFood();
            createParticles(f.x, f.y, 'cyan'); updateUI();
        }
    });

    entities.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if(p.life <= 0) entities.particles.splice(i, 1);
    });

    if(audioCtx) {
        let nv = signalLevel > 50 ? 0 : (50 - signalLevel) / 50;
        noiseGain.gain.setTargetAtTime(nv * 0.2, audioCtx.currentTime, 0.1);
    }
}

function draw() {
    ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(-camera.x, -camera.y);

    // World
    ctx.strokeStyle = '#112'; ctx.lineWidth = 2;
    for(let i=0; i<=WORLD_SIZE; i+=200) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    // Shield
    if (shieldActive) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 80, 0, Math.PI*2); ctx.stroke();
    }

    // Core
    ctx.shadowBlur = 30; ctx.shadowColor = 'cyan';
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 50, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'cyan'; ctx.stroke();

    // Turrets
    entities.turrets.forEach(t => {
        ctx.fillStyle = 'white'; ctx.fillRect(t.x-10, t.y-10, 20, 20);
    });

    // Bullets
    ctx.fillStyle = 'yellow'; entities.bullets.forEach(b => ctx.fillRect(b.x-3, b.y-3, 6, 6));

    // Food & Enemies
    entities.food.forEach(f => { ctx.fillStyle = 'cyan'; ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, Math.PI*2); ctx.fill(); });
    entities.enemies.forEach(en => { ctx.fillStyle = '#ff0055'; ctx.fillRect(en.x-15, en.y-15, 30, 30); });

    // Snake
    ctx.fillStyle = '#39ff14'; ctx.shadowColor = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const r = snake.size * (1 - i / snake.segments.length);
        ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, Math.PI*2); ctx.fill();
    });

    ctx.restore();
}

/** HELPERS */
function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0) {x=Math.random()*WORLD_SIZE; y=-100;}
    else if(side===1) {x=WORLD_SIZE+100; y=Math.random()*WORLD_SIZE;}
    else if(side===2) {x=Math.random()*WORLD_SIZE; y=WORLD_SIZE+100;}
    else {x=-100; y=Math.random()*WORLD_SIZE;}
    entities.enemies.push({ x, y, speed: 1.2 + Math.random() });
}
function spawnFood() { entities.food.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE }); }
function createParticles(x, y, color) {
    for(let i=0; i<10; i++) entities.particles.push({ x, y, color, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1.0 });
}
function updateUI() {
    document.getElementById('signal-bar').style.width = signalLevel + '%';
    document.getElementById('lives-val').innerText = lives;
    document.getElementById('score-val').innerText = score;
}
function gameOver() { started = false; document.getElementById('game-over-screen').classList.remove('hidden'); }
function gameLoop() { if(!started || paused) return; update(); draw(); requestAnimationFrame(gameLoop); }
function togglePause() { if(!started) return; paused = !paused; document.getElementById('pause-icon').className = paused ? "fas fa-play" : "fas fa-pause"; if(!paused) gameLoop(); }
function sendPing() { fetch('https://radio.store/ping.php?game=SignalDefender').catch(()=>{}); }
function initJoystick() {
    const zone = document.getElementById('joystick-zone'), stick = document.getElementById('joystick-stick');
    let active = false;
    const handle = (e) => {
        if(!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width/2, centerY = rect.top + rect.height/2;
        let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
        const dist = Math.min(rect.width/2, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
        stick.style.left = `calc(50% + ${Math.cos(ang)*dist}px)`; stick.style.top = `calc(50% + ${Math.sin(ang)*dist}px)`;
        input.x = Math.cos(ang); input.y = Math.sin(ang);
    };
    zone.addEventListener('touchstart', (e) => { active = true; handle(e); });
    window.addEventListener('touchmove', handle, {passive:false});
    window.addEventListener('touchend', () => { active = false; stick.style.left='50%'; stick.style.top='50%'; });
}
init();
</script>
</body>
</html>
