<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — LepotaFM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-barba="wrapper">

    <header>
        <div class="logo">LepotaFM</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="chat.html" class="active">Чат и Эфир</a>
        </nav>
    </header>

    <!-- Меняется только этот блок -->
    <main data-barba="container" data-barba-namespace="chat">
        <div class="content-box">
            <h1>Чат слушателей</h1>
            <p>Передавайте приветы в прямой эфир!</p>
            
            <!-- Сюда потом вставите код виджета Telegram или Cbox -->
            <div style="background: #eee; height: 300px; padding: 20px; border-radius: 10px; color: #333;">
                Место для виджета чата...
            </div>
        </div>
    </main>

    <!-- Плеер дублируем, чтобы структура была одинаковой (Barba это любит) -->
    <div class="fixed-player">
        <!-- Содержимое плеера не важно, скрипт его не тронет, если он вне main -->
    </div>

    <script src="https://unpkg.com/@barba/core"></script>
    <script src="https://unpkg.com/gsap@latest/dist/gsap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
