<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signal Defender - LepotaFM Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-blue: #00f3ff;
            --neon-red: #ff0055;
            --neon-purple: #bc13fe;
        }
        body {
            margin: 0; padding: 0; background: #000;
            color: #fff; font-family: 'Segoe UI', sans-serif;
            overflow: hidden; touch-action: none; user-select: none;
        }
        canvas { display: block; }

        /* ИНТЕРФЕЙС */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .stat-box {
            position: absolute; background: rgba(0,0,0,0.7);
            padding: 10px 15px; border: 1px solid var(--neon-blue);
            border-radius: 10px; pointer-events: auto;
        }
        #top-left { top: 60px; left: 15px; }
        #top-right { top: 60px; right: 15px; text-align: right; }

        .bar-container {
            width: 120px; height: 10px; background: #222;
            border-radius: 5px; overflow: hidden; margin-top: 5px;
        }
        #signal-bar {
            width: 100%; height: 100%; background: var(--neon-green);
            transition: width 0.3s, background 0.3s;
        }

        /* КНОПКИ УПРАВЛЕНИЯ ПРИЛОЖЕНИЕМ */
        .app-controls {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; background: rgba(21, 21, 37, 0.95);
            border-bottom: 1px solid var(--neon- purple); pointer-events: auto;
        }
        .control-btn {
            width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-blue); border-radius: 50%;
            color: var(--neon-blue); display: flex; align-items: center;
            justify-content: center; cursor: pointer;
        }

        /* ЭКРАНЫ */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            pointer-events: auto; text-align: center;
        }
        .overlay h1 { color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); margin-bottom: 10px; }
        .btn-start {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background: none; border: 2px solid var(--neon-green);
            color: var(--neon-green); border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 15px var(--neon-green); transition: 0.3s;
        }
        .btn-start:active { transform: scale(0.9); }
        .hidden { display: none !important; }

        /* ДЖОЙСТИК */
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px; background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0, 243, 255, 0.2); border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; background: var(--neon-blue);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--neon-blue);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="app-controls">
            <button class="control-btn" onclick="openTrackInfo()"><i class="fas fa-info"></i></button>
            <div style="color: var(--neon-purple); font-weight: bold; letter-spacing: 2px;">SIGNAL DEFENDER</div>
            <button class="control-btn" onclick="togglePause()"><i class="fas fa-pause" id="pause-icon"></i></button>
        </div>

        <!-- СТАТИСТИКА -->
        <div id="top-left" class="stat-box">
            <div>СИГНАЛ</div>
            <div class="bar-container"><div id="signal-bar"></div></div>
        </div>

        <div id="top-right" class="stat-box">
            <div>БАЗА: <span id="lives-val" style="color: var(--neon-red)">3</span></div>
            <div id="score-val">Очки: 0</div>
        </div>

        <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ -->
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <!-- ЭКРАНЫ -->
    <div id="start-screen" class="overlay">
        <h1>SIGNAL DEFENDER</h1>
        <p style="color: #888; margin-bottom: 20px;">Защищай базу в центре.<br>Ешь "ноты" для чистоты звука.<br>Собирай "PowerUp" чтобы есть врагов.</p>
        <button class="btn-start" onclick="startGame()">ЗАПУСТИТЬ ЭФИР</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">ЭФИР ПОТЕРЯН</h1>
        <p id="final-score">Отражено атак: 0</p>
        <button class="btn-start" style="border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);" onclick="location.reload()">ПЕРЕЗАГРУЗКА</button>
    </div>

<script>
/** 
 * CONFIG & SETTINGS 
 */
const STREAM_URL = "https://lepotafm.ru/listen/lepotafm/radio.mp3";
const WORLD_SIZE = 2000;
const BASE_POS = { x: 1000, y: 1000 };

/** 
 * GAME STATE 
 */
let canvas, ctx;
let started = false, paused = false;
let signalLevel = 100;
let lives = 3;
let score = 0;
let powerModeTimer = 0;

let snake = {
    segments: [],
    x: 1050, y: 1050,
    angle: 0, speed: 4,
    size: 15, length: 10
};

let entities = { food: [], enemies: [], powerups: [], particles: [] };
let camera = { x: 0, y: 0 };
let input = { x: 0, y: 0 };

// AudioContext variables
let audioCtx, musicSource, noiseNode, musicGain, noiseGain;

/** 
 * INITIALIZATION 
 */
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    
    // Joystick Logic
    initJoystick();
    
    // Keyboard Logic
    window.addEventListener('keydown', e => {
        if(e.key === 'ArrowLeft') input.x = -1;
        if(e.key === 'ArrowRight') input.x = 1;
        if(e.key === 'ArrowUp') input.y = -1;
        if(e.key === 'ArrowDown') input.y = 1;
    });

    // Start Pinging
    setInterval(sendPing, 60000);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

/** 
 * AUDIO SYSTEM 
 */
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Music Stream
    const music = new Audio(STREAM_URL);
    music.crossOrigin = "anonymous";
    musicSource = audioCtx.createMediaElementSource(music);
    musicGain = audioCtx.createGain();
    
    // White Noise Generator
    const bufferSize = 2 * audioCtx.sampleRate;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    
    const noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = noiseBuffer;
    noiseSource.loop = true;
    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0;

    // Connect
    musicSource.connect(musicGain).connect(audioCtx.destination);
    noiseSource.connect(noiseGain).connect(audioCtx.destination);

    music.play();
    noiseSource.start();
}

function updateAudioLogic() {
    if(!audioCtx) return;
    
    let mVol, nVol;
    if (signalLevel > 50) {
        mVol = 1.0; nVol = 0.0;
    } else {
        mVol = signalLevel / 50;
        nVol = (50 - signalLevel) / 50;
    }
    
    musicGain.gain.setTargetAtTime(mVol, audioCtx.currentTime, 0.1);
    noiseGain.gain.setTargetAtTime(nVol * 0.3, audioCtx.currentTime, 0.1); // Noise is quieter
}

/** 
 * JOYSTICK 
 */
function initJoystick() {
    const zone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    let active = false;

    const handleInput = (e) => {
        if(!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const dist = Math.min(rect.width / 2, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);

        stick.style.left = `calc(50% + ${Math.cos(angle) * dist}px)`;
        stick.style.top = `calc(50% + ${Math.sin(angle) * dist}px)`;
        
        input.x = Math.cos(angle);
        input.y = Math.sin(angle);
    };

    zone.addEventListener('touchstart', (e) => { active = true; handleInput(e); });
    window.addEventListener('touchmove', handleInput, {passive:false});
    window.addEventListener('touchend', () => { 
        active = false; 
        stick.style.left = '50%'; stick.style.top = '50%';
    });
}

/** 
 * GAME LOOP 
 */
function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    initAudio();
    started = true;
    
    // Init Snake segments
    for(let i=0; i<snake.length; i++) {
        snake.segments.push({x: snake.x, y: snake.y});
    }
    
    // Spawn initial entities
    for(let i=0; i<15; i++) spawnFood();
    spawnPowerUp();

    requestAnimationFrame(gameLoop);
    
    // Decay signal
    setInterval(() => {
        if(started && !paused) {
            signalLevel = Math.max(0, signalLevel - 1);
            if(signalLevel <= 0) gameOver();
            updateUI();
        }
    }, 1000);
}

function gameLoop() {
    if(!started || paused) return;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

function update() {
    // 1. Snake Movement
    if(input.x !== 0 || input.y !== 0) {
        snake.angle = Math.atan2(input.y, input.x);
    }
    
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;

    // Wrap / Clamp World
    snake.x = Math.max(0, Math.min(WORLD_SIZE, snake.x));
    snake.y = Math.max(0, Math.min(WORLD_SIZE, snake.y));

    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    // 2. Camera follow
    camera.x = snake.x - canvas.width / 2;
    camera.y = snake.y - canvas.height / 2;

    // 3. Enemies
    if(Math.random() < 0.02) spawnEnemy();
    
    entities.enemies.forEach((en, index) => {
        const angle = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(angle) * en.speed;
        en.y += Math.sin(angle) * en.speed;

        // Collision with Base
        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 40) {
            lives--;
            entities.enemies.splice(index, 1);
            createParticles(en.x, en.y, 'red');
            if(lives <= 0) gameOver();
            updateUI();
        }

        // Collision with Snake Head
        const distToHead = Math.hypot(en.x - snake.x, en.y - snake.y);
        if(distToHead < 25) {
            if(powerModeTimer > Date.now()) {
                // Eat enemy
                entities.enemies.splice(index, 1);
                score += 50;
                createParticles(en.x, en.y, 'blue');
            } else {
                // Take damage
                snake.length = Math.max(5, snake.length - 2);
                entities.enemies.splice(index, 1);
                createParticles(en.x, en.y, 'red');
            }
            updateUI();
        }
    });

    // 4. Food
    entities.food.forEach((f, index) => {
        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 20) {
            entities.food.splice(index, 1);
            signalLevel = Math.min(100, signalLevel + 10);
            snake.length += 2;
            score += 10;
            spawnFood();
            createParticles(f.x, f.y, 'cyan');
            updateUI();
        }
    });

    // 5. Powerups
    entities.powerups.forEach((p, index) => {
        if(Math.hypot(p.x - snake.x, p.y - snake.y) < 20) {
            entities.powerups.splice(index, 1);
            powerModeTimer = Date.now() + 10000;
            setTimeout(spawnPowerUp, 20000);
            createParticles(p.x, p.y, 'purple');
        }
    });

    // 6. Particles
    entities.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if(p.life <= 0) entities.particles.splice(i, 1);
    });

    updateAudioLogic();
}

/** 
 * DRAWING 
 */
function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Grid
    ctx.strokeStyle = '#112';
    ctx.lineWidth = 1;
    for(let i=0; i<=WORLD_SIZE; i+=100) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    // World Border
    ctx.strokeStyle = '#bc13fe';
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    // Base
    const isBaseDanger = lives === 1 && Date.now() % 500 < 250;
    ctx.shadowBlur = 20;
    ctx.shadowColor = isBaseDanger ? 'red' : '#00f3ff';
    ctx.fillStyle = isBaseDanger ? '#500' : '#151525';
    ctx.beginPath();
    ctx.arc(BASE_POS.x, BASE_POS.y, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = isBaseDanger ? 'red' : '#00f3ff';
    ctx.stroke();

    // Food
    ctx.shadowBlur = 10;
    entities.food.forEach(f => {
        ctx.shadowColor = 'cyan';
        ctx.fillStyle = 'cyan';
        ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI*2); ctx.fill();
    });

    // PowerUps
    entities.powerups.forEach(p => {
        ctx.shadowColor = 'purple';
        ctx.fillStyle = 'purple';
        ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
    });

    // Enemies
    const inPower = powerModeTimer > Date.now();
    entities.enemies.forEach(en => {
        ctx.shadowColor = inPower ? 'blue' : 'red';
        ctx.fillStyle = inPower ? '#0044ff' : '#ff0055';
        ctx.fillRect(en.x - 10, en.y - 10, 20, 20);
    });

    // Particles
    entities.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    });
    ctx.globalAlpha = 1.0;

    // Snake
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#39ff14';
    ctx.fillStyle = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const size = snake.size * (1 - i / snake.segments.length);
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, size, 0, Math.PI*2);
        ctx.fill();
    });

    ctx.restore();
}

/** 
 * HELPERS 
 */
function spawnFood() {
    entities.food.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE });
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side === 0) { x = Math.random() * WORLD_SIZE; y = -50; }
    else if(side === 1) { x = WORLD_SIZE + 50; y = Math.random() * WORLD_SIZE; }
    else if(side === 2) { x = Math.random() * WORLD_SIZE; y = WORLD_SIZE + 50; }
    else { x = -50; y = Math.random() * WORLD_SIZE; }
    
    entities.enemies.push({ x, y, speed: 1.5 + Math.random(), color: 'red' });
}

function spawnPowerUp() {
    entities.powerups.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE });
}

function createParticles(x, y, color) {
    for(let i=0; i<10; i++) {
        entities.particles.push({
            x, y, color,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0
        });
    }
}

function updateUI() {
    const bar = document.getElementById('signal-bar');
    bar.style.width = signalLevel + '%';
    if(signalLevel < 30) bar.style.background = 'red';
    else if(signalLevel < 60) bar.style.background = 'orange';
    else bar.style.background = 'var(--neon-green)';

    document.getElementById('lives-val').innerText = lives;
    document.getElementById('score-val').innerText = 'Очки: ' + score;
}

function gameOver() {
    started = false;
    paused = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = 'Отражено атак: ' + score;
    if(musicSource) musicSource.mediaElement.pause();
}

function togglePause() {
    if(!started) return;
    paused = !paused;
    document.getElementById('pause-icon').className = paused ? "fas fa-play" : "fas fa-pause";
    if(!paused) gameLoop();
}

function sendPing() {
    fetch('https://radio.store/ping.php?game=SignalDefender').catch(() => {});
}

// LepotaFM Interface support
function openTrackInfo() {
    if(window.parent && window.parent.openSku) {
        const title = window.parent.document.getElementById('track-name').innerText;
        const artist = window.parent.document.getElementById('artist-name').innerText;
        const art = window.parent.document.getElementById('mini-art').src;
        window.parent.openSku(title, artist, art);
    }
}

// Master interface for Tab switching
window.setGamePause = function(state) {
    if(started) {
        paused = state;
        document.getElementById('pause-icon').className = paused ? "fas fa-play" : "fas fa-pause";
        if(!paused) gameLoop();
    }
}

init();

</script>
</body>
</html>
