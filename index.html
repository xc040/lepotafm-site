<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="neon-bg"></div>
    <div class="scanlines"></div>
    <div class="app-layout">
        <header class="fixed-top-area">
            <div class="inline-player">
                <div class="player-info-col">
                    <div class="top-row">
                        <div class="logo-small">LEPOTA<span class="neon-text">FM</span></div>
                        <div class="vol-mini-container">
                            <i class="fas fa-volume-down tiny-icon"></i>
                            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                        </div>
                    </div>
                    <div class="bot-row">
                        <div class="marquee-container">
                            <div class="marquee-content">
                                <span id="track-name">Загрузка...</span>
                                <span class="separator" id="track-sep"> - </span>
                                <span id="artist-name">LepotaFM</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="player-btn-col">
                    <button id="play-btn" class="big-play-btn">
                        <img id="mini-art" src="logo.jpg" alt="Art" onerror="this.src='logo.jpg'">
                        <span class="icon-overlay"><i class="fas fa-play" id="play-icon"></i></span>
                    </button>
                </div>
            </div>
            <nav class="tabs">
                <button class="tab-btn active" onclick="openTab('home', this)">Игра</button>
                <button class="tab-btn" onclick="openTab('catalog', this)">Каталог</button>
                <button class="tab-btn" onclick="openTab('studio', this)">Студия</button>
                <button class="tab-btn" onclick="openTab('ether', this)">Эфир</button>
            </nav>
        </header>

        <main class="main-content">
            <!-- Вкладка ИГРА (без изменений) -->
            <div id="home" class="tab-pane active full-height">
                <iframe id="game-frame" src="games/snake/index.html" frameborder="0"></iframe>
            </div>

            <!-- Вкладка КАТАЛОГ (без изменений) -->
            <div id="catalog" class="tab-pane scrollable-pad">
                <div class="catalog-grid">
                    <div class="game-card" onclick="loadGame('games/snake/index.html')">
                        <div class="game-card-icon"><i class="fas fa-snake"></i></div>
                        <div class="game-card-info">
                            <span class="game-card-title">Змейка</span>
                            <span class="game-card-desc">Классический режим</span>
                        </div>
                        <i class="fas fa-play play-mini"></i>
                    </div>
                    <div class="game-card" onclick="loadGame('games/strazh/index.html')">
                        <div class="game-card-icon" style="color:#bc13fe"><i class="fas fa-shield-virus"></i></div>
                        <div class="game-card-info">
                            <span class="game-card-title">Страж Эфира</span>
                            <span class="game-card-desc">Защита радиоволны</span>
                        </div>
                        <i class="fas fa-play play-mini" style="color:#bc13fe"></i>
                    </div>
                </div>
            </div>

            <!-- Вкладка СТУДИЯ (Новая структура с 4 под-вкладками) -->
            <div id="studio" class="tab-pane full-height">
                <div class="sub-nav-bar">
                    <button class="sub-tab-btn active" onclick="openSubTab('studio', 's-make', this)">Делать</button>
                    <button class="sub-tab-btn" onclick="openSubTab('studio', 's-ver', this)">Версия</button>
                    <button class="sub-tab-btn" onclick="openSubTab('studio', 's-proj', this)">Проект</button>
                    <button class="sub-tab-btn" onclick="openSubTab('studio', 's-price', this)">Цены</button>
                </div>
                <div class="sub-content-area">
                    <div id="s-make" class="sub-pane active"><div class="placeholder-box">Раздел "Делать"</div></div>
                    <div id="s-ver" class="sub-pane"><div class="placeholder-box">Раздел "Версия"</div></div>
                    <div id="s-proj" class="sub-pane"><div class="placeholder-box">Раздел "Проект"</div></div>
                    <div id="s-price" class="sub-pane"><div class="placeholder-box">Раздел "Цены"</div></div>
                </div>
            </div>

            <!-- Вкладка ЭФИР (Новая структура с 4 под-вкладками) -->
            <div id="ether" class="tab-pane full-height">
                 <div class="sub-nav-bar">
                    <button class="sub-tab-btn active" onclick="openSubTab('ether', 'e-hist', this)">История</button>
                    <button class="sub-tab-btn" onclick="openSubTab('ether', 'e-misc', this)">Разное</button>
                    <button class="sub-tab-btn" onclick="openSubTab('ether', 'e-shop', this)">Магазин</button>
                    <button class="sub-tab-btn" onclick="openSubTab('ether', 'e-info', this)">Инфо</button>
                </div>
                <div class="sub-content-area scrollable-pad">
                    <!-- Сюда перенесли историю (ID history-container важен для JS) -->
                    <div id="e-hist" class="sub-pane active">
                        <div class="history-list" id="history-container"><div class="loading-msg">Загрузка...</div></div>
                    </div>
                    <!-- Сюда перенесли разное (будильник, таймер) -->
                    <div id="e-misc" class="sub-pane">
                        <div class="placeholder-box">
                            <h3>Будильник</h3>
                            <p>Настройки будильника...</p>
                            <hr style="border-color:#333; margin: 20px 0;">
                            <h3>Таймер</h3>
                            <p>Настройки таймера...</p>
                        </div>
                    </div>
                    <div id="e-shop" class="sub-pane"><div class="placeholder-box">Магазин</div></div>
                    <div id="e-info" class="sub-pane"><div class="placeholder-box">Информация</div></div>
                </div>
            </div>
        </main>
    </div>
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" onclick="closeSku()">✕</button>
            <img id="modal-art" src="logo.jpg">
            <h2 id="modal-title">...</h2>
            <p id="modal-artist">...</p>
            <div class="modal-actions">
                <a href="https://t.me/lepotafm" target="_blank" class="action-btn tg">Написать</a>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
<!-- Оверлей для запуска игры (отдельное окно поверх всего, но под хедером) -->
    <div id="game-overlay" class="overlay-window hidden">
        <button class="close-overlay-btn" onclick="closeOverlayGame()">✕ ЗАКРЫТЬ</button>
        <iframe id="overlay-frame" src=""></iframe>
    </div>
</body>
</html>
