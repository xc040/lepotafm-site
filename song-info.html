<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Инфо</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Стили для этой страницы (Компактные) */
        .info-container {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 20px;
            height: 100vh; box-sizing: border-box;
            /* Центрируем всё по вертикали, чтобы было красиво без скролла */
            justify-content: center; 
        }
        
        .back-nav {
            position: absolute; top: 20px; left: 20px;
        }
        .back-btn {
            background: none; border: none; color: var(--neon-blue);
            font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 10px;
        }

        /* Обложка чуть меньше, чтобы всё влезало */
        .big-cover {
            width: 200px; height: 200px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            margin-top: 20px; margin-bottom: 20px;
            border: 2px solid var(--neon-pink);
            object-fit: cover;
        }

        .song-title-large { font-size: 22px; font-weight: bold; margin-bottom: 5px; color: white; }
        .song-artist-large { font-size: 16px; color: var(--neon-blue); margin-bottom: 30px; }

        /* Кнопка VK */
        .vk-btn {
            width: 100%; max-width: 280px;
            padding: 15px; border-radius: 12px;
            background: #0077FF; /* Цвет ВК */
            text-decoration: none; color: white; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 119, 255, 0.4);
            transition: 0.2s;
        }
        .vk-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="neon-bg"></div>
    <div class="scanlines"></div>

    <div class="info-container">
        
        <!-- Кнопка Назад -->
        <nav class="back-nav">
            <button class="back-btn" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
        </nav>

        <!-- Обложка -->
        <img id="page-art" src="logo.jpg" class="big-cover">
        
        <!-- Текст -->
        <div class="song-title-large" id="page-title">Название</div>
        <div class="song-artist-large" id="page-artist">Артист</div>

        <!-- Кнопка VK -->
        <a href="https://vk.com/pesnipop" target="_blank" class="vk-btn">
            <i class="fab fa-vk"></i> Найти в группе VK
        </a>

    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const title = params.get('title');
            const artist = params.get('artist');
            const art = params.get('art');

            if(title) document.getElementById('page-title').innerText = title;
            if(artist) document.getElementById('page-artist').innerText = artist;
            if(art && art !== 'undefined') document.getElementById('page-art').src = art;
        };
    </script>

</body>
</html>
