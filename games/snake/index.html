<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; touch-action: none; }
        .game-controls { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(21, 21, 37, 0.95); border-bottom: 1px solid #00f3ff; z-index: 1000; }
        .control-btn { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05); border: 1px solid #00f3ff; border-radius: 50%; color: #00f3ff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; }
        .game-title-container { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; z-index: 1001; }
        .game-title-mini { color: #00f3ff; font-size: 14px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 8px #00f3ff; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.8; transform: scale(1); } }
        .game-score { font-size: 10px; color: #ff0055; text-transform: uppercase; font-weight: bold; margin-top: -1px; }
        canvas { border: 1px solid #333; background: #111; box-shadow: 0 0 25px rgba(0, 243, 255, 0.15); max-width: 95vw; max-height: 75vh; position: relative; z-index: 1; margin-top: 40px; }
        .start-msg { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #00f3ff; pointer-events: none; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px black; z-index: 10; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px; border: 1px solid #00f3ff; }
        .paused-text { display: none; position: absolute; top: 50%; font-size: 35px; color: #ff0055; font-weight: bold; text-shadow: 0 0 15px black; pointer-events: none; z-index: 10; }
        #click-catcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
    </style>
</head>
<body>
    <div id="click-catcher"></div>
    <div class="game-controls">
        <button class="control-btn" onclick="openInfo()"><i class="fas fa-info"></i></button>
        <div class="game-title-container" onclick="location.reload()"><div class="game-title-mini">SNAKE</div><div class="game-score">Score: <span id="s">0</span></div></div>
        <button class="control-btn" onclick="toggleP(event)"><i class="fas fa-pause" id="p-icon"></i></button>
    </div>
    <div class="start-msg" id="msg">Нажми на экран,<br>чтобы играть</div>
    <div class="paused-text" id="p-msg">ПАУЗА</div>
    <canvas width="320" height="320" id="g"></canvas>
    <script>
        var canvas=document.getElementById('g'), ctx=canvas.getContext('2d'), grid=16, count=0, score=0, gameId, started=false, paused=false;
        var snake={x:160,y:160,dx:grid,dy:0,cells:[],max:4}, apple={x:320,y:320};
        function rnd(min,max){return Math.floor(Math.random()*(max-min))+min;}
        function openInfo(){if(window.parent&&window.parent.openSku)window.parent.openSku(window.parent.document.getElementById('track-name').innerText,window.parent.document.getElementById('artist-name').innerText,window.parent.document.getElementById('mini-art').src);}
        
        document.getElementById('click-catcher').onclick = function() {
            if (!started) {
                started = true;
                document.getElementById('msg').style.display = 'none';
                document.getElementById('click-catcher').style.display = 'none';
                loop();
            }
        };

        function toggleP(e){
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if(!started)return;
            paused=!paused;
            document.getElementById('p-icon').className=paused?"fas fa-play":"fas fa-pause";
            document.getElementById('p-msg').style.display=paused?"block":"none";
            if(!paused)loop();
        }
        window.setGamePause=function(s){if(started&&s&&!paused)toggleP();};
        function loop(){
            if(paused||!started)return; gameId=requestAnimationFrame(loop); if(++count<6)return; count=0; ctx.clearRect(0,0,canvas.width,canvas.height);
            snake.x+=snake.dx; snake.y+=snake.dy;
            if(snake.x<0)snake.x=canvas.width-grid; else if(snake.x>=canvas.width)snake.x=0;
            if(snake.y<0)snake.y=canvas.height-grid; else if(snake.y>=canvas.height)snake.y=0;
            snake.cells.unshift({x:snake.x,y:snake.y}); if(snake.cells.length>snake.max)snake.cells.pop();
            ctx.fillStyle='#ff0055'; ctx.fillRect(apple.x,apple.y,grid-1,grid-1);
            ctx.fillStyle='#00f3ff'; snake.cells.forEach(function(cell,i){
                ctx.fillRect(cell.x,cell.y,grid-1,grid-1);
                if(cell.x===apple.x&&cell.y===apple.y){snake.max++;score++;document.getElementById('s').innerText=score;apple.x=rnd(0,20)*grid;apple.y=rnd(0,20)*grid;}
                for(var j=i+1;j<snake.cells.length;j++){if(cell.x===snake.cells[j].x&&cell.y===snake.cells[j].y){started=false;document.getElementById('msg').style.display='block';document.getElementById('msg').innerHTML="GAME OVER<br>Score: "+score;document.getElementById('click-catcher').style.display = 'block';snake={x:160,y:160,dx:grid,dy:0,cells:[],max:4};score=0;}}
            });
        }
        let tsX,tsY; document.ontouchstart=e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;};
        document.ontouchmove=e=>{if(paused||!started||e.target.closest('.game-controls'))return;let x=e.touches[0].clientX-tsX,y=e.touches[0].clientY-tsY;if(Math.abs(x)>Math.abs(y)){if(x>15&&snake.dx===0){snake.dx=grid;snake.dy=0;}else if(x<-15&&snake.dx===0){snake.dx=-grid;snake.dy=0;}}else{if(y>15&&snake.dy===0){snake.dy=grid;snake.dx=0;}else if(y<-15&&snake.dy===0){snake.dy=-grid;snake.dx=0;}}e.preventDefault();};
    </script>
</body>
</html>
