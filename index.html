<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LepotaFM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="neon-bg"></div>
    <div class="scanlines"></div>

    <!-- ВЕРХНЯЯ ЗОНА -->
    <div class="fixed-top-area">
        <header>
            <div class="logo">LEPOTA<span class="neon-text">FM</span></div>
            <div class="live-indicator">LIVE</div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab('ether', this)">Эфир</button>
            <button class="tab-btn" onclick="openTab('chat', this)">Студия</button>
            <button class="tab-btn" onclick="openTab('features', this)">Фичи</button>
        </nav>

        <div class="inline-player">
            <img id="mini-art" src="logo.jpg" alt="Art" onerror="this.src='logo.jpg'">
            <div class="player-info">
                <div id="track-name">Загрузка...</div>
                <div id="artist-name">LepotaFM</div>
            </div>
            <button id="play-btn" class="control-btn">
                <i class="fas fa-play" id="play-icon"></i>
            </button>
        </div>
    </div>

    <!-- НИЖНЯЯ ЗОНА -->
    <div class="main-content">
        
        <!-- Вкладка ЭФИР -->
        <div id="ether" class="tab-pane active">
            <div class="history-list" id="history-container">
                <div class="loading-msg">
                    <i class="fas fa-circle-notch fa-spin"></i> Загрузка...
                </div>
            </div>
        </div>

        <!-- Вкладка СТУДИЯ -->
        <div id="chat" class="tab-pane">
            <div class="placeholder-box">
                <i class="fab fa-telegram-plane" style="font-size: 40px; color: #0088cc; margin-bottom: 15px;"></i>
                <h3>Связь со студией</h3>
                <p>Заявки и приветы через Telegram</p>
                <a href="https://t.me/lepotafm" target="_blank" class="neon-btn">Написать</a>
            </div>
        </div>

        <!-- Вкладка ФИЧИ -->
        <div id="features" class="tab-pane">
            <div class="settings-box">
                
                <!-- 1. ТАЙМЕР СНА (СЛАЙДЕР) -->
                <div class="feature-card">
                    <div class="feature-header">
                        <i class="fas fa-moon"></i> Таймер сна
                    </div>
                    
                    <div class="timer-slider-box">
                        <div class="timer-display">
                            <span id="timer-val-display">Off</span>
                        </div>
                        <input type="range" id="sleep-slider" min="0" max="180" step="15" value="0" oninput="updateSleepLabel(this.value)" onchange="setSleepTimer(this.value)">
                        <div class="slider-labels">
                            <span>0</span>
                            <span>3ч</span>
                        </div>
                    </div>

                    <div id="sleep-status" class="status-hidden">
                        Выкл через: <span id="sleep-countdown" class="neon-text">00:00</span>
                    </div>
                </div>

                <!-- 2. БУДИЛЬНИК (СПИСОК) -->
                <div class="feature-card">
                    <div class="feature-header">
                        <i class="fas fa-clock"></i> Будильники
                    </div>
                    
                    <!-- Форма создания -->
                    <div class="alarm-create-box">
                        <input type="time" id="new-alarm-time" class="neon-input">
                        <div class="days-selector">
                            <span class="day-check" data-day="1" onclick="toggleDay(this)">Пн</span>
                            <span class="day-check" data-day="2" onclick="toggleDay(this)">Вт</span>
                            <span class="day-check" data-day="3" onclick="toggleDay(this)">Ср</span>
                            <span class="day-check" data-day="4" onclick="toggleDay(this)">Чт</span>
                            <span class="day-check" data-day="5" onclick="toggleDay(this)">Пт</span>
                            <span class="day-check" data-day="6" onclick="toggleDay(this)">Сб</span>
                            <span class="day-check" data-day="0" onclick="toggleDay(this)">Вс</span>
                        </div>
                        <button class="add-alarm-btn" onclick="addAlarm()">+ Добавить</button>
                    </div>

                    <!-- Список будильников -->
                    <div id="alarms-list">
                        <!-- Сюда JS добавит будильники -->
                    </div>
                    
                    <div id="alarm-msg" class="status-hidden">⏰ ПОДЪЕМ!</div>
                </div>

                <!-- 3. ГРОМКОСТЬ -->
                <div class="setting-row volume-row">
                    <span>Громкость</span>
                    <div class="vol-control">
                        <i class="fas fa-volume-down"></i>
                        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
                        <i class="fas fa-volume-up"></i>
                    </div>
                </div>

                <div class="setting-row">
                    <span>Высокое качество</span>
                    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>

            </div>
        </div>

    </div>

    <script src="main.js"></script>
    <script src="features.js"></script>
</body>
</html>
