<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signal Defender 11.4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon-green: #39ff14; --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-purple: #bc13fe; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stat-box { position: absolute; background: rgba(5, 5, 20, 0.9); padding: 8px 12px; border: 1px solid var(--neon-blue); border-radius: 10px; pointer-events: auto; font-size: 11px; }
        #top-left { top: 65px; left: 15px; }
        #top-right { top: 65px; right: 15px; text-align: right; }

        .app-controls { position: absolute; top: 0; left: 0; right: 0; height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #0f0f1e; border-bottom: 2px solid var(--neon-purple); pointer-events: auto; }
        .control-btn { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-blue); border-radius: 50%; color: var(--neon-blue); display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* ОБУЧЕНИЕ: СЛЕВА ОТ СТИКА */
        #tutorial-box {
            position: absolute; bottom: 50px; left: 20px;
            background: rgba(0, 0, 0, 0.9); border: 2px solid var(--neon-blue);
            padding: 15px; border-radius: 15px; text-align: left;
            width: 200px; z-index: 20; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            font-size: 13px; font-weight: bold; color: #fff; pointer-events: auto;
            line-height: 1.4; animation: flash 2s infinite;
        }
        @keyframes flash { 0%, 100% { border-color: var(--neon-blue); } 50% { border-color: var(--neon-purple); } }

        /* ДЖОЙСТИК СПРАВА */
        #joystick-zone { position: absolute; bottom: 50px; right: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: var(--neon-blue); border-radius: 50%; transform: translate(-50%, -50%); }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .shop-content { width: 90%; max-width: 380px; max-height: 85vh; background: #0a0a1a; border: 2px solid var(--neon-purple); padding: 20px; border-radius: 20px; overflow-y: auto; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .shop-item { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 10px; border-radius: 12px; text-align: center; cursor: pointer; }
        .shop-item i { color: var(--neon-blue); font-size: 18px; margin-bottom: 4px; display: block; }
        .shop-item b { font-size: 11px; color: var(--neon-green); }

        .btn-start { padding: 12px 35px; font-size: 18px; font-weight: bold; background: none; border: 2px solid var(--neon-green); color: var(--neon-green); border-radius: 30px; cursor: pointer; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="app-controls">
            <button class="control-btn" id="shop-btn-ui" onclick="toggleShop(true)"><i class="fas fa-shopping-cart"></i></button>
            <div style="color: var(--neon-blue); font-weight: bold; font-size: 14px; letter-spacing: 2px;">СТРАЖ ЭФИРА</div>
            <button class="control-btn" onclick="togglePause()"><i class="fas fa-pause" id="pause-icon"></i></button>
        </div>

        <div id="top-left" class="stat-box">
            <div style="font-size: 9px;">СИГНАЛ</div>
            <div style="width: 80px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; border: 1px solid #333;">
                <div id="signal-bar" style="width: 100%; height: 100%; background: var(--neon-green); transition: width 0.3s;"></div>
            </div>
        </div>
        
        <div id="top-right" class="stat-box">
            <div>БАЗА: <span id="lives-val" style="color:var(--neon-red)">3</span></div>
            <div>ДАННЫЕ: <span id="score-val" style="color:var(--neon-green)">0</span></div>
        </div>

        <!-- ОКНО МИССИЙ -->
        <div id="tutorial-box" class="hidden">
            <div style="font-size: 10px; color: var(--neon-blue); margin-bottom: 5px;">ТЕКУЩАЯ МИССИЯ:</div>
            <div id="tut-text">Инициализация...</div>
        </div>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-modal" class="modal hidden">
        <div class="shop-content">
            <h2 style="color: var(--neon-purple); text-align:center; font-size: 18px; margin:0;">МОДЕРНИЗАЦИЯ</h2>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyUpgrade('turret', 1200)"><i class="fas fa-crosshairs"></i><b>Турель</b><span>1.2k</span></div>
                <div class="shop-item" onclick="buyUpgrade('shield', 600)"><i class="fas fa-shield-alt"></i><b>Щит Ядра</b><span>0.6k</span></div>
                <div class="shop-item" onclick="buyUpgrade('fix', 1500)"><i class="fas fa-tools"></i><b>Ремонт</b><span>1.5k</span></div>
                <div class="shop-item" onclick="buyUpgrade('emp', 1000)"><i class="fas fa-bolt"></i><b>ЭМИ</b><span>1.0k</span></div>
            </div>
            <div style="padding:10px; background:rgba(255,255,255,0.03); border-radius:10px; font-size:11px; color:#888; border: 1px solid #333;">
                <b style="color:var(--neon-blue)">СПРАВКА:</b> Защищай центр. Сигнал падает. Ешь голубые байты. Данные трать на пушки. (c) LepotaFM 2025.
            </div>
            <button class="btn-start" style="width:100%; margin-top:15px; font-size: 14px;" onclick="toggleShop(false)">В БОЙ</button>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="color:var(--neon-blue); letter-spacing:4px; text-shadow: 0 0 20px var(--neon-blue);">СТРАЖ ЭФИРА</h1>
        <button class="btn-start" onclick="startGame()">ЗАГРУЗКА ПРОТОКОЛОВ</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-red);">DATA CORRUPTED</h1>
        <button class="btn-start" onclick="location.reload()">ПЕРЕЗАГРУЗКА</button>
    </div>

<script>
/** CONFIG */
const WORLD_SIZE = 4000; 
const BASE_POS = { x: 2000, y: 2000 };
const ZOOM = 0.35; 

/** STATE */
let canvas, ctx, started = false, paused = false, score = 0, signalLevel = 100, lives = 3, gameId;
let snake = { x: 2050, y: 2050, segments: [], angle: 0, speed: 5.5, size: 25, length: 15 };
let entities = { food: [], enemies: [], particles: [], turrets: [], bullets: [] };
let camera = { x: 0, y: 0 }, input = { x: 0, y: 0 };
let shieldActive = false, tutStep = 0;

function init() {
    canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
    resize(); initJoystick(); window.addEventListener('resize', resize);
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

function toggleShop(s) { 
    if(!started) return;
    paused = s;
    document.getElementById('shop-modal').classList.toggle('hidden', !s);
    if(s && tutStep === 4) { tutStep = 5; nextTut(); } 
    if(!s) { gameId = requestAnimationFrame(gameLoop); } else { cancelAnimationFrame(gameId); }
}

function togglePause() {
    if(!started) return;
    paused = !paused;
    document.getElementById('pause-icon').className = paused ? "fas fa-play" : "fas fa-pause";
    if(!paused) { gameId = requestAnimationFrame(gameLoop); } else { cancelAnimationFrame(gameId); }
}

function buyUpgrade(type, cost) {
    if (score < cost) return;
    score -= cost;
    if (type === 'turret') {
        const ang = Math.random() * 6.28;
        entities.turrets.push({ x: BASE_POS.x + Math.cos(ang)*150, y: BASE_POS.y + Math.sin(ang)*150, lastShot: 0 });
        if(tutStep === 5) nextTut();
    }
    if (type === 'shield') shieldActive = true;
    if (type === 'fix') lives = Math.min(3, lives + 1);
    if (type === 'emp') { entities.enemies = []; }
    updateUI();
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    started = true;
    for(let i=0; i<15; i++) spawnFood();
    gameId = requestAnimationFrame(gameLoop);
    showTut("Используй стик справа: начни движение");
    
    setInterval(() => { 
        if(started && !paused && tutStep > 1) {
            let decay = Math.hypot(snake.x-BASE_POS.x, snake.y-BASE_POS.y) < 400 ? 0.4 : 1;
            signalLevel = Math.max(0, signalLevel - decay); 
            if(signalLevel <= 0) gameOver();
            updateUI(); 
        }
    }, 1500);
}

/** MISSION SYSTEM */
function showTut(text) {
    const box = document.getElementById('tutorial-box');
    box.classList.remove('hidden');
    document.getElementById('tut-text').innerText = text;
}

function nextTut() {
    tutStep++;
    if(tutStep === 1) showTut("Найди и съешь голубой БАЙТ, чтобы включить радио");
    else if(tutStep === 2) showTut("Враги близко! Уничтожь красную помеху, ударив её ГОЛОВОЙ");
    else if(tutStep === 3) showTut("Отлично. Копи 1200 данных для покупки турели");
    else if(tutStep === 4) {
        showTut("Лимит данных достигнут! Нажми на КОРЗИНУ слева");
        if(!paused) togglePause(); // Принудительная пауза для захода в магазин
    }
    else if(tutStep === 5) showTut("Купи ТУРЕЛЬ в меню модернизации");
    else if(tutStep === 6) showTut("Протоколы завершены. Защищай эфир, Страж!");
    else setTimeout(() => document.getElementById('tutorial-box').classList.add('hidden'), 5000);
}

function update() {
    if(!started || paused) return;

    if(input.x || input.y) {
        snake.angle = Math.atan2(input.y, input.x);
        if(tutStep === 0) nextTut();
    }
    
    snake.x += Math.cos(snake.angle) * snake.speed;
    snake.y += Math.sin(snake.angle) * snake.speed;

    // Loop map
    if(snake.x < 0) snake.x = WORLD_SIZE; if(snake.x > WORLD_SIZE) snake.x = 0;
    if(snake.y < 0) snake.y = WORLD_SIZE; if(snake.y > WORLD_SIZE) snake.y = 0;

    snake.segments.unshift({x: snake.x, y: snake.y});
    if(snake.segments.length > snake.length) snake.segments.pop();

    camera.x = snake.x - (canvas.width / ZOOM) / 2;
    camera.y = snake.y - (canvas.height / ZOOM) / 2;

    // Turrets
    entities.turrets.forEach(t => {
        if (Date.now() - t.lastShot > 1500 && entities.bullets.length < 15) {
            let target = entities.enemies[0];
            if (target && Math.hypot(t.x-target.x, t.y-target.y) < 1000) {
                const a = Math.atan2(target.y - t.y, target.x - t.x);
                entities.bullets.push({x: t.x, y: t.y, vx: Math.cos(a)*15, vy: Math.sin(a)*15});
                t.lastShot = Date.now();
            }
        }
    });

    entities.bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if(Math.hypot(b.x-BASE_POS.x, b.y-BASE_POS.y) > 2000) entities.bullets.splice(i,1);
    });

    // Враги только после сбора первой еды
    if(tutStep >= 2 && Math.random() < 0.007) spawnEnemy();

    entities.enemies.forEach((en, i) => {
        const ang = Math.atan2(BASE_POS.y - en.y, BASE_POS.x - en.x);
        en.x += Math.cos(ang) * en.speed; en.y += Math.sin(ang) * en.speed;

        entities.bullets.forEach((b, bi) => {
            if(Math.hypot(b.x-en.x, b.y-en.y) < 50) {
                entities.enemies.splice(i,1); entities.bullets.splice(bi,1);
                score += 50; updateUI();
            }
        });

        if(Math.hypot(en.x - BASE_POS.x, en.y - BASE_POS.y) < 70) {
            if (shieldActive) shieldActive = false; else lives--;
            entities.enemies.splice(i, 1);
            if(lives <= 0) gameOver(); updateUI();
        }

        if(Math.hypot(en.x - snake.x, en.y - snake.y) < 50) {
            score += 100; entities.enemies.splice(i, 1);
            if(tutStep === 2) nextTut(); // Миссия "Убить головой"
            updateUI();
        }
    });

    entities.food.forEach((f, i) => {
        if(Math.hypot(f.x - snake.x, f.y - snake.y) < 60) {
            signalLevel = Math.min(100, signalLevel + 20);
            snake.length += 2; score += 25;
            entities.food.splice(i, 1); spawnFood();
            if(tutStep === 1) nextTut(); // Миссия "Съесть байт"
            updateUI();
        }
    });

    if(score >= 1200 && tutStep === 3) nextTut(); // Миссия "Накопить 1200"
}

function draw() {
    ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(-camera.x, -camera.y);

    ctx.strokeStyle = '#112'; ctx.lineWidth = 5;
    for(let i=0; i<=WORLD_SIZE; i+=1000) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
    }

    ctx.shadowBlur = 30; ctx.shadowColor = 'cyan';
    ctx.fillStyle = '#112'; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 60, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'cyan'; ctx.lineWidth = 5; ctx.stroke();
    ctx.shadowBlur = 0; 

    if(shieldActive) { ctx.strokeStyle = 'cyan'; ctx.lineWidth = 15; ctx.beginPath(); ctx.arc(BASE_POS.x, BASE_POS.y, 110, 0, 6.28); ctx.stroke(); }

    entities.enemies.forEach(en => {
        const ang = Math.atan2(en.y - BASE_POS.y, en.x - BASE_POS.x);
        ctx.save(); ctx.translate(BASE_POS.x, BASE_POS.y); ctx.rotate(ang);
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.moveTo(160, -12); ctx.lineTo(190, 0); ctx.lineTo(160, 12); ctx.fill(); ctx.restore();
    });

    ctx.fillStyle = '#fff'; entities.turrets.forEach(t => ctx.fillRect(t.x-25, t.y-25, 50, 50));
    ctx.fillStyle = 'yellow'; entities.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 6.28); ctx.fill(); });
    ctx.fillStyle = 'cyan'; entities.food.forEach(f => { ctx.beginPath(); ctx.arc(f.x, f.y, 25, 0, 6.28); ctx.fill(); });
    ctx.fillStyle = '#ff0055'; entities.enemies.forEach(en => { ctx.fillRect(en.x-35, en.y-35, 70, 70); });

    // ЗМЕЙКА: ЧЕТКАЯ, БЕЗ СВЕЧЕНИЯ
    ctx.fillStyle = '#39ff14';
    snake.segments.forEach((seg, i) => {
        const r = (snake.size * (1 - i / snake.segments.length)) + 5;
        ctx.beginPath(); ctx.arc(seg.x, seg.y, r, 0, 6.28); ctx.fill();
    });

    const baseAng = Math.atan2(BASE_POS.y - snake.y, BASE_POS.x - snake.x);
    ctx.save(); ctx.translate(snake.x, snake.y); ctx.rotate(baseAng);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.6)'; ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(50, -15); ctx.lineTo(50, 15); ctx.fill(); ctx.restore();

    ctx.restore();
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0) {x=Math.random()*WORLD_SIZE; y=-200;}
    else if(side===1) {x=WORLD_SIZE+200; y=Math.random()*WORLD_SIZE;}
    else if(side===2) {x=Math.random()*WORLD_SIZE; y=WORLD_SIZE+200;}
    else {x=-200; y=Math.random()*WORLD_SIZE;}
    entities.enemies.push({ x, y, speed: 1.5 + Math.random() });
}
function spawnFood() { entities.food.push({ x: 500 + Math.random()*(WORLD_SIZE-1000), y: 500 + Math.random()*(WORLD_SIZE-1000) }); }

function updateUI() {
    document.getElementById('signal-bar').style.width = signalLevel + '%';
    document.getElementById('lives-val').innerText = lives;
    document.getElementById('score-val').innerText = score;
}
function gameOver() { started = false; document.getElementById('game-over-screen').classList.remove('hidden'); }
function gameLoop() { if(!started || paused) return; update(); draw(); gameId = requestAnimationFrame(gameLoop); }

function initJoystick() {
    const zone = document.getElementById('joystick-zone'), stick = document.getElementById('joystick-stick');
    let active = false;
    const handle = (e) => {
        if(!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width/2, centerY = rect.top + rect.height/2;
        let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
        const dist = Math.min(rect.width/2, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
        stick.style.left = `calc(50% + ${Math.cos(ang)*dist}px)`; stick.style.top = `calc(50% + ${Math.sin(ang)*dist}px)`;
        input.x = Math.cos(ang); input.y = Math.sin(ang);
    };
    zone.addEventListener('touchstart', (e) => { active = true; handle(e); });
    window.addEventListener('touchmove', handle, {passive:false});
    window.addEventListener('touchend', () => { active = false; stick.style.left='50%'; stick.style.top='50%'; input.x=0; input.y=0; });
}

window.setGamePause = function(state) {
    if(started) { paused = state; if(!paused) gameId = requestAnimationFrame(gameLoop); else cancelAnimationFrame(gameId); }
};
init();
</script>
</body>
</html>
